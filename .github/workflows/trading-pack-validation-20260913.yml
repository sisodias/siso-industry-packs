name: Trading pack integrity and registry update 20260913
on:
  push:
    branches: [research/trading-20260913]
    paths: [.github/workflows/trading-pack-validation-20260913.yml]
permissions:
  contents: write
jobs:
  validate-research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate authored research and update only its registries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'sisodias/siso-industry-packs'
          assert os.environ['GITHUB_REF_NAME'] == 'research/trading-20260913'
          url = 'https://raw.githubusercontent.com/' + repo + '/' + os.environ['GITHUB_SHA'] + '/packs/trading/evidence/validate-and-register.py'
          with urllib.request.urlopen(url, timeout=30) as response:
              source = response.read()
          exec(compile(source, url, 'exec'))
          PY
