name: Cannabis public evidence audit
on:
  push:
    branches: [main]
    paths: [packs/cannabis_dispensary/evidence/audit-request.json]
permissions:
  contents: write
concurrency:
  group: cannabis-public-evidence-audit
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      REQUEST_REVISION: ${{ github.sha }}
    steps:
      - name: Read public evidence, never execute upstream code
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, concurrent.futures, datetime, hashlib, json, os, re, time, urllib.request, urllib.error, urllib.parse
          REPO='sisodias/siso-industry-packs'; API='https://api.github.com'; ROOT='packs/cannabis_dispensary/evidence/'
          assert os.environ['GH_REPOSITORY']==REPO
          TOKEN=os.environ['GH_TOKEN']; NOW=datetime.datetime.now(datetime.timezone.utc).isoformat(); outputs={}
          def api(path,data=None,method=None):
              assert path.startswith('/') and not path.startswith('//')
              for attempt in range(5):
                  req=urllib.request.Request(API+path,data=None if data is None else json.dumps(data).encode(),method=method,headers={'Authorization':'Bearer '+TOKEN,'Accept':'application/vnd.github+json','User-Agent':'siso-cannabis-public-evidence','X-GitHub-Api-Version':'2022-11-28'})
                  try:
                      with urllib.request.urlopen(req,timeout=90) as r:return json.load(r)
                  except urllib.error.HTTPError as e:
                      if e.code in (403,429,500,502,503,504) and attempt<4:time.sleep(8*(attempt+1));continue
                      return {'_error':e.code}
              return {'_error':'retries'}
          def output(name,value):
              assert re.fullmatch(r'[A-Za-z0-9_.-]+',name)
              outputs[ROOT+name]=value if isinstance(value,str) else json.dumps(value,ensure_ascii=False,indent=2)+'\n'
          req=api('/repos/'+REPO+'/contents/'+ROOT+'audit-request.json?ref='+os.environ['REQUEST_REVISION'])
          cfg=json.loads(base64.b64decode(req['content'])); assert cfg['mode'] in ('search','candidates')
          assert cfg.get('stage3_checkpoint_sha256')=='4920aff62e39cb35d5cfc0c3f4658cca62f60802e2d1167648effd4859b577cc'
          if cfg['mode']=='search':
              assert 1<=len(cfg['queries'])<=60
              records=[];known={n.lower() for n in cfg.get('previously_seen',[])};added=set()
              for q in cfg['queries']:
                  assert 1<=q.get('per_page',10)<=30
                  path='/search/repositories?'+urllib.parse.urlencode({'q':q['query'],'sort':'stars','order':'desc','per_page':q.get('per_page',10),'page':q.get('page',1)})
                  result=api(path); items=result.get('items',[])
                  row={**q,'observed_at':NOW,'source_url':API+path,'total_count':result.get('total_count'),'incomplete_results':result.get('incomplete_results'),'error':result.get('_error'),'results':[],'new_names':[]}
                  for r in items:
                      n=r['full_name']; row['results'].append({k:r.get(k) for k in ('full_name','description','html_url','stargazers_count','archived','pushed_at','license','topics')})
                      if n.lower() not in known:known.add(n.lower());added.add(n);row['new_names'].append(n)
                  records.append(row);time.sleep(2.2)
              rnd=str(cfg['round']).zfill(2)
              output('search-round-'+rnd+'.json',{'round':cfg['round'],'observed_at':NOW,'queries':records,'unique_new_count':len(added),'new_names':sorted(added),'scope':'Bounded query pages. Search discovery is not repository examination and not proof of global exhaustion.'})
              output('search-round-'+rnd+'-brief.jsonl',''.join(json.dumps({k:v for k,v in r.items() if k!='results'}|{'hits':[(x['full_name'],x['stargazers_count'],x['description']) for x in r['results']]},ensure_ascii=False)+'\n' for r in records))
          else:
              names=list(dict.fromkeys(cfg['repositories'])); assert 1<=len(names)<=170
              assert all(re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',n) for n in names)
              def decode(obj,n,rev):
                  if not isinstance(obj,dict) or not obj.get('content'):return {'error':obj.get('_error','empty') if isinstance(obj,dict) else 'unexpected'}
                  b=base64.b64decode(obj['content']);t=b.decode('utf-8','replace')
                  return {'path':obj['path'],'sha256':hashlib.sha256(b).hexdigest(),'text':t,'characters':len(t),'source_url':'https://github.com/'+n+'/blob/'+str(rev)+'/'+obj['path']}
              def collect(pair):
                  number,name=pair;out={'audit_id':'R'+str(number).zfill(3),'requested_full_name':name,'observed_at':NOW};m=api('/repos/'+name)
                  if '_error' in m:return out|{'retrieval_error':m['_error']}
                  assert not m['private']
                  n=m['full_name'];base='/repos/'+n
                  out.update({k:m.get(k) for k in ('full_name','html_url','description','stargazers_count','forks_count','default_branch','archived','disabled','created_at','updated_at','pushed_at','size','open_issues_count','topics','license')})
                  cs=api(base+'/commits?per_page=1');rev=cs[0]['sha'] if isinstance(cs,list) and cs else None
                  out['revision']=rev;out['last_commit']=cs[0]['commit']['committer']['date'] if rev else None
                  out['sources']={'repository':API+base,'commit':cs[0]['html_url'] if rev else None}
                  suffix='?ref='+rev if rev else ''
                  out['readme']=decode(api(base+'/readme'+suffix),n,rev)
                  lic=api(base+'/license'+suffix);out['license_file']=decode(lic,n,rev);out['license_file']['detected']=lic.get('license')
                  recent=api(base+'/commits?since=2026-03-13T00:00:00Z&per_page=100');out['commits_six_months_sample_count']=len(recent) if isinstance(recent,list) else None;out['commits_six_months_capped']=isinstance(recent,list) and len(recent)==100
                  people=api(base+'/contributors?per_page=10');out['contributors_top10']=[{'login':p.get('login'),'contributions':p.get('contributions')} for p in people] if isinstance(people,list) else None
                  out['bus_factor']='unmeasured; contributor count is not maintainer redundancy'
                  issues=api(base+'/issues?state=all&sort=updated&direction=desc&per_page=10')
                  out['issues_sample']=[{k:i.get(k) for k in ('number','title','state','created_at','updated_at','closed_at','comments','html_url','author_association')} for i in issues if 'pull_request' not in i][:3] if isinstance(issues,list) else None
                  replies=[]
                  for issue in (out.get('issues_sample') or [])[:1]:
                      if issue['comments']:
                          comments=api(base+'/issues/'+str(issue['number'])+'/comments?per_page=20')
                          if isinstance(comments,list):
                              owned=[c for c in comments if c.get('author_association') in ('OWNER','MEMBER','COLLABORATOR')]
                              if owned:replies.append({'issue':issue['number'],'created_at':issue['created_at'],'first_affiliated_reply_in_sample':owned[0]['created_at'],'source_url':owned[0]['html_url']})
                  out['issue_response_sample']=replies
                  return out
              with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:rows=list(pool.map(collect,enumerate(names,1)))
              bankrepo='sisodias/siso-repo-bank';head=api('/repos/'+bankrepo+'/commits/main')['sha']
              paths=['bank/bank_capability_top.jsonl','bank/bank_capability.jsonl','capability-shelf/source-registry.jsonl','bank/bank_best.jsonl','bank/bank_adoption_v2.jsonl','bank/bank_liftable_ranked.jsonl','bank/bank_contractcard.jsonl']
              wanted={n.lower() for n in names}|{r['full_name'].lower() for r in rows if r.get('full_name')};bank={};receipt={'observed_at':NOW,'bank_repository':bankrepo,'bank_revision':head,'files':[],'upstream_execution':'none; public text and data retrieval only','bank_read_mode':'stream JSONL and retain matching rows; bank_best is never loaded wholesale'}
              def fullname(row):
                  for key in ('full_name','repo_full_name','repository_full_name','repository','repo','name','url','repo_url','repository_url','source_url'):
                      v=row.get(key)
                      if isinstance(v,str):
                          v=v.removeprefix('https://github.com/').removesuffix('.git').strip('/')
                          if re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',v):return v.lower()
                  return None
              for path in paths:
                  url='https://raw.githubusercontent.com/'+bankrepo+'/'+head+'/'+path;idx={};count=0;identified=0;digest=hashlib.sha256();samples=[];unparsed=[]
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'siso-cannabis-public-evidence'}),timeout=90) as stream:
                      for line in stream:
                          digest.update(line)
                          if not line.strip():continue
                          row=json.loads(line);count+=1;n=fullname(row);identified+=bool(n)
                          if len(samples)<3:samples.append(row)
                          if not n and len(unparsed)<3:unparsed.append(row)
                          if n in wanted:idx.setdefault(n,[]).append(row)
                  bank[path]=idx;receipt['files'].append({'path':path,'rows':count,'identified_repository_rows':identified,'sha256':digest.hexdigest(),'source_url':'https://github.com/'+bankrepo+'/blob/'+head+'/'+path,'schema_samples':samples,'unparsed_samples':unparsed})
              membership_ok=all(x['rows']==x['identified_repository_rows'] for x in receipt['files'] if x['path'] in ('bank/bank_best.jsonl','capability-shelf/source-registry.jsonl'))
              review=[]
              for i,r in enumerate(rows,1):
                  aliases={r['requested_full_name'].lower(),r.get('full_name','').lower()}
                  r['bank_revision']=head;r['bank_rows']={p:[x for a in aliases for x in idx.get(a,[])] for p,idx in bank.items() if p!='bank/bank_capability.jsonl'}
                  r['bank_membership_layers']=[p for p,x in r['bank_rows'].items() if x];r['bank_status']='ALREADY IN THE BANK' if r['bank_membership_layers'] else ('NEW' if membership_ok else 'UNRESOLVED');r['adoption_evidence']=r['bank_rows'].get('bank/bank_adoption_v2.jsonl',[])
                  rm=r.get('readme',{});li=r.get('license_file',{})
                  r['readme']={k:v for k,v in rm.items() if k!='text'}|{'excerpt':rm.get('text','')[:9000]}
                  r['license_file']={k:v for k,v in li.items() if k!='text'}|{'excerpt':li.get('text','')[:2600],'tail':li.get('text','')[-800:]}
                  output('repo-'+str(i).zfill(3)+'.json',r)
                  small={k:r.get(k) for k in ('audit_id','full_name','description','stargazers_count','archived','last_commit','revision','license','commits_six_months_sample_count','commits_six_months_capped','bank_status','bank_membership_layers','adoption_evidence','retrieval_error')}
                  small['readme_excerpt']=rm.get('text','')[:3000];small['readme_characters']=rm.get('characters');small['readme_source']=rm.get('source_url');small['license_excerpt']=li.get('text','')[:1000];small['license_source']=li.get('source_url');small['license_error']=li.get('error');small['issue_response_sample']=r.get('issue_response_sample');small['top_contributor_count']=len(r.get('contributors_top10') or []);review.append(small)
              for start in range(0,len(review),5):output('review-'+str(start//5+1).zfill(2)+'.jsonl',''.join(json.dumps(x,ensure_ascii=False)+'\n' for x in review[start:start+5]))
              output('candidate-index.jsonl',''.join(json.dumps({k:v for k,v in x.items() if k not in ('readme_excerpt','license_excerpt','adoption_evidence','issue_response_sample')},ensure_ascii=False)+'\n' for x in review))
              receipt.update({'requested':len(names),'repositories_retrieved':sum(bool(r.get('full_name')) for r in rows),'readmes_retrieved':sum(bool(r.get('readme',{}).get('excerpt')) for r in rows),'license_files_retrieved':sum(bool(r.get('license_file',{}).get('excerpt')) for r in rows),'current_commit_retrieved':sum(bool(r.get('revision')) for r in rows),'already_in_bank':sum(r.get('bank_status')=='ALREADY IN THE BANK' for r in rows),'new':sum(r.get('bank_status')=='NEW' for r in rows),'membership_complete':membership_ok,'membership_definition':'Match in repo-bank layers, including source-registry shelf; shelf membership is held, not quality admission'})
              output('candidate-audit-receipt.json',receipt)
          for attempt in range(6):
              ref=api('/repos/'+REPO+'/git/ref/heads/main');parent=ref['object']['sha'];commit=api('/repos/'+REPO+'/git/commits/'+parent)
              tree=api('/repos/'+REPO+'/git/trees',{'base_tree':commit['tree']['sha'],'tree':[{'path':p,'mode':'100644','type':'blob','content':t} for p,t in outputs.items()]},'POST')
              if '_error' in tree:raise RuntimeError('evidence tree write failed '+str(tree['_error']))
              c=api('/repos/'+REPO+'/git/commits',{'message':'research(cannabis): publish '+cfg['mode']+' public-evidence receipts','tree':tree['sha'],'parents':[parent]},'POST')
              if '_error' in c:raise RuntimeError('evidence commit failed')
              result=api('/repos/'+REPO+'/git/refs/heads/main',{'sha':c['sha'],'force':False},'PATCH')
              if '_error' not in result:print('Published',len(outputs),'cannabis evidence files; commit',c['sha']);break
              if result['_error'] not in (409,422):raise RuntimeError('ref update failed '+str(result['_error']))
          else:raise RuntimeError('concurrent main changes prevented safe publication')
          print('Public-source research only. No upstream code executed, no application built or deployed.')
          PY
