name: Cannabis public evidence audit
on:
  push:
    branches: [main]
    paths: [packs/cannabis_dispensary/evidence/audit-request.json]
permissions:
  contents: write
concurrency:
  group: cannabis-public-evidence-audit
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      REQUEST_REVISION: ${{ github.sha }}
    steps:
      - name: Collect public evidence without executing upstream projects
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, concurrent.futures, datetime, hashlib, json, os, pathlib, re, subprocess, tempfile, time, urllib.request, urllib.error, urllib.parse
          REPO='sisodias/siso-industry-packs'; API='https://api.github.com'; ROOT='packs/cannabis_dispensary/evidence/'
          assert os.environ['GH_REPOSITORY']==REPO
          TOKEN=os.environ['GH_TOKEN']; NOW=datetime.datetime.now(datetime.timezone.utc).isoformat(); outputs={}; errors=[]
          DEST=pathlib.Path('/tmp/cannabis-evidence'); DEST.mkdir(exist_ok=True)
          def get(url,auth=False):
              headers={'User-Agent':'siso-public-research','Accept':'application/vnd.github+json'}
              if auth:headers['Authorization']='Bearer '+TOKEN
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=50) as r:return r.read()
              except urllib.error.HTTPError as e:
                  return {'_error':e.code,'url':url,'remaining':e.headers.get('x-ratelimit-remaining'),'reset':e.headers.get('x-ratelimit-reset')}
              except Exception as e:return {'_error':type(e).__name__,'url':url}
          def api(path):
              value=get(API+path,True)
              if isinstance(value,dict):
                  errors.append(value);value=get(API+path,False)
              if isinstance(value,dict):errors.append(value);return value
              try:return json.loads(value)
              except Exception:return {'_error':'invalid_json'}
          def raw(repo,path,rev='main'):
              value=get('https://raw.githubusercontent.com/'+repo+'/'+rev+'/'+path)
              return value if isinstance(value,bytes) else None
          def output(name,value):
              assert re.fullmatch(r'[A-Za-z0-9_.-]+',name)
              text=value if isinstance(value,str) else json.dumps(value,ensure_ascii=False,indent=2)+'\n'
              outputs[ROOT+name]=text;(DEST/name).write_text(text)
          cfg=json.loads(raw(REPO,ROOT+'audit-request.json',os.environ['REQUEST_REVISION']))
          assert cfg['mode'] in ('search','candidates')
          assert cfg['stage3_checkpoint_sha256']=='4920aff62e39cb35d5cfc0c3f4658cca62f60802e2d1167648effd4859b577cc'
          if cfg['mode']=='search':
              assert 1<=len(cfg['queries'])<=60
              records=[];known={n.lower() for n in cfg.get('previously_seen',[])};added=set()
              for q in cfg['queries']:
                  assert 1<=q.get('per_page',10)<=100
                  path='/search/repositories?'+urllib.parse.urlencode({'q':q['query'],'sort':'stars','order':'desc','per_page':q.get('per_page',10),'page':q.get('page',1)})
                  result=api(path);items=result.get('items',[])
                  row={**q,'observed_at':NOW,'source_url':API+path,'total_count':result.get('total_count'),'incomplete_results':result.get('incomplete_results'),'error':result.get('_error'),'results':[],'new_names':[]}
                  for r in items:
                      n=r['full_name'];row['results'].append({k:r.get(k) for k in ('full_name','description','html_url','stargazers_count','forks_count','default_branch','archived','pushed_at','license','topics')})
                      if n.lower() not in known:known.add(n.lower());added.add(n);row['new_names'].append(n)
                  records.append(row);print('Query completed:',q['stage'],q['lane'],'hits',len(items),'error',row['error'],flush=True);time.sleep(2.5)
              rnd=str(cfg['round']).zfill(2)
              output('search-round-'+rnd+'.json',{'round':cfg['round'],'observed_at':NOW,'queries':records,'unique_new_count':len(added),'new_names':sorted(added),'scope':'Bounded pages, not global exhaustion. Search results are discovery, not examination.'})
              output('search-round-'+rnd+'-brief.jsonl',''.join(json.dumps({k:v for k,v in r.items() if k!='results'}|{'hits':[(x['full_name'],x['stargazers_count'],x['description']) for x in r['results']]},ensure_ascii=False)+'\n' for r in records))
          else:
              names=list(dict.fromkeys(cfg['repositories']));assert 1<=len(names)<=170
              assert all(re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',n) for n in names)
              bankrepo='sisodias/siso-repo-bank';head='2d7d35ecbf7e1158d0a3527e1489040687ac214b'
              paths=['bank/bank_capability_top.jsonl','bank/bank_capability.jsonl','capability-shelf/source-registry.jsonl','bank/bank_best.jsonl','bank/bank_adoption_v2.jsonl','bank/bank_liftable_ranked.jsonl','bank/bank_contractcard.jsonl']
              wanted={n.lower() for n in names};bank={};receipt={'observed_at':NOW,'bank_revision':head,'files':[],'upstream_execution':'none; Git clones are source reads only'}
              def fullname(row):
                  for key in ('full_name','repo_full_name','repository_full_name','repository','repo','name','url','repo_url','repository_url','source_url'):
                      v=row.get(key)
                      if isinstance(v,str):
                          v=v.removeprefix('https://github.com/').removesuffix('.git').strip('/')
                          if re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',v):return v.lower()
                  return None
              for path in paths:
                  idx={};count=0;identified=0;digest=hashlib.sha256();samples=[];unparsed=[];url='https://raw.githubusercontent.com/'+bankrepo+'/'+head+'/'+path
                  try:
                      with urllib.request.urlopen(url,timeout=90) as stream:
                          for line in stream:
                              digest.update(line)
                              if not line.strip():continue
                              row=json.loads(line);count+=1;n=fullname(row);identified+=bool(n)
                              if len(samples)<2:samples.append(row)
                              if not n and len(unparsed)<3:unparsed.append(row)
                              if n in wanted:idx.setdefault(n,[]).append(row)
                      bank[path]=idx;receipt['files'].append({'path':path,'rows':count,'identified_repository_rows':identified,'sha256':digest.hexdigest(),'source_url':url,'schema_samples':samples,'unparsed_samples':unparsed})
                  except Exception as e:bank[path]={};receipt['files'].append({'path':path,'error':type(e).__name__})
              membership_ok=all(x.get('rows',-1)==x.get('identified_repository_rows',-2) for x in receipt['files'] if x['path'] in ('bank/bank_best.jsonl','capability-shelf/source-registry.jsonl'))
              meta={}
              for rnd in cfg.get('search_rounds',[]):
                  doc=raw(REPO,ROOT+'search-round-'+str(rnd).zfill(2)+'.json')
                  if doc:
                      for q in json.loads(doc)['queries']:
                          for m in q['results']:meta[m['full_name'].lower()]=m|{'metadata_source':q['source_url'],'metadata_observed_at':q['observed_at']}
              def collect(pair):
                  number,name=pair;n=name;out={'audit_id':'R'+str(number).zfill(3),'full_name':n,'html_url':'https://github.com/'+n,'observed_at':NOW}
                  m=meta.get(n.lower()) or api('/repos/'+n)
                  if '_error' not in m:out.update({k:m.get(k) for k in ('description','stargazers_count','forks_count','default_branch','archived','pushed_at','license','topics','metadata_source','metadata_observed_at')})
                  else:out['metadata_error']=m['_error']
                  wd=pathlib.Path(tempfile.mkdtemp(prefix='candidate-'))
                  cp=subprocess.run(['git','clone','--filter=blob:none','--depth=100','--no-checkout','https://github.com/'+n+'.git',str(wd/'repo')],capture_output=True,text=True,timeout=160)
                  if cp.returncode:out['retrieval_error']='git_clone_failed';return out
                  cwd=wd/'repo'
                  def git(*args):
                      p=subprocess.run(['git','-C',str(cwd),*args],capture_output=True,timeout=50)
                      return p.stdout if p.returncode==0 else None
                  rev=git('rev-parse','HEAD').decode().strip();out['revision']=rev
                  log=git('log','-1','--format=%cI');out['last_commit']=log.decode().strip() if log else None
                  logs=git('log','--since=2026-03-13T00:00:00Z','--format=%H');out['commits_six_months_sample_count']=len(logs.splitlines()) if logs else 0;out['commits_six_months_capped']=out['commits_six_months_sample_count']==100
                  authors=git('log','--format=%aN');out['authors_sample_count']=len(set(authors.splitlines())) if authors else None;out['bus_factor']='unmeasured; distinct commit authors are not maintainer redundancy';out['issue_response_sample']='not_measured'
                  listing=git('ls-tree','-r','--name-only','HEAD');files=listing.decode('utf-8','replace').splitlines() if listing else []
                  out['root_files']=[p for p in files if '/' not in p]
                  def doc(paths,limit):
                      if not paths:return {'error':'not_found'}
                      p=paths[0];b=git('show','HEAD:'+p)
                      if b is None:return {'error':'unreadable','path':p}
                      text=b.decode('utf-8','replace');return {'path':p,'sha256':hashlib.sha256(b).hexdigest(),'characters':len(text),'excerpt':text[:limit],'tail':text[-700:] if limit<5000 else '', 'source_url':'https://github.com/'+n+'/blob/'+rev+'/'+p}
                  out['readme']=doc(sorted([p for p in files if '/' not in p and re.match(r'^readme(?:\.|$)',p,re.I)],key=len),9000)
                  out['license_file']=doc(sorted([p for p in files if '/' not in p and re.match(r'^(licen[sc]e|copying)(?:\.|$)',p,re.I)],key=len),3000)
                  out['nested_license_paths']=[p for p in files if '/' in p and re.search(r'/(licen[sc]e|copying)(\.|$)',p,re.I)][:40]
                  dep=[p for p in files if p in ('package.json','composer.json','pyproject.toml','requirements.txt','go.mod','Cargo.toml','docker-compose.yml','compose.yaml','docker-compose.yaml')]
                  out['dependency_documents']=[doc([p],4000) for p in dep[:3]]
                  out['sources']={'repository':'https://github.com/'+n,'commit':'https://github.com/'+n+'/commit/'+rev}
                  return out
              with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:rows=list(pool.map(collect,enumerate(names,1)))
              review=[]
              for i,r in enumerate(rows,1):
                  n=r['full_name'].lower();r['bank_revision']=head;r['bank_rows']={p:idx.get(n,[]) for p,idx in bank.items() if p!='bank/bank_capability.jsonl'}
                  r['bank_membership_layers']=[p for p,v in r['bank_rows'].items() if v];r['bank_status']='ALREADY IN THE BANK' if r['bank_membership_layers'] else ('NEW' if membership_ok else 'UNRESOLVED');r['adoption_evidence']=r['bank_rows'].get('bank/bank_adoption_v2.jsonl',[])
                  output('repo-'+str(i).zfill(3)+'.json',r)
                  small={k:r.get(k) for k in ('audit_id','full_name','description','stargazers_count','metadata_source','metadata_observed_at','archived','last_commit','revision','license','commits_six_months_sample_count','commits_six_months_capped','authors_sample_count','bank_status','bank_membership_layers','adoption_evidence','retrieval_error','metadata_error')}
                  for key,limit in (('readme',2500),('license_file',1000)):
                      d=r.get(key,{})
                      small[key]={k:v for k,v in d.items() if k not in ('excerpt','tail')}|{'excerpt':d.get('excerpt','')[:limit]}
                  small['nested_license_paths']=r.get('nested_license_paths');small['dependency_names']=[d.get('path') for d in r.get('dependency_documents',[])];review.append(small)
              for start in range(0,len(review),5):output('review-'+str(start//5+1).zfill(2)+'.jsonl',''.join(json.dumps(x,ensure_ascii=False)+'\n' for x in review[start:start+5]))
              output('candidate-index.jsonl',''.join(json.dumps({k:v for k,v in x.items() if k not in ('readme','license_file','adoption_evidence')},ensure_ascii=False)+'\n' for x in review))
              receipt.update({'requested':len(names),'repositories_retrieved':sum(bool(r.get('revision')) for r in rows),'readmes_retrieved':sum(bool(r.get('readme',{}).get('excerpt')) for r in rows),'license_files_retrieved':sum(bool(r.get('license_file',{}).get('excerpt')) for r in rows),'metadata_with_stars':sum(r.get('stargazers_count') is not None for r in rows),'already_in_bank':sum(r.get('bank_status')=='ALREADY IN THE BANK' for r in rows),'new':sum(r.get('bank_status')=='NEW' for r in rows),'membership_complete':membership_ok,'examination_status':'retrieval only; analyst must read and judge each record'})
              output('candidate-audit-receipt.json',receipt)
          output('last-collector-errors.json',{'observed_at':NOW,'errors':errors,'mode':cfg['mode'],'round':cfg.get('round')})
          # Git transport avoids the shared REST write quota. Only this pack's evidence is staged.
          env=os.environ.copy();env['GIT_CONFIG_COUNT']='1';env['GIT_CONFIG_KEY_0']='http.https://github.com/.extraheader';env['GIT_CONFIG_VALUE_0']='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+TOKEN).encode()).decode()
          wd=pathlib.Path('/tmp/cannabis-publish');wd.mkdir(exist_ok=True)
          def run(*args):
              p=subprocess.run(['git','-C',str(wd),*args],env=env,capture_output=True,text=True,timeout=150)
              if p.returncode:raise RuntimeError('Git operation failed: '+args[0])
              return p.stdout
          run('init');run('remote','add','origin','https://github.com/'+REPO+'.git');run('config','user.name','SISO research evidence');run('config','user.email','80409709+sisodias@users.noreply.github.com')
          for attempt in range(8):
              run('fetch','--depth=1','origin','main');run('checkout','--detach','-f','FETCH_HEAD')
              for path,text in outputs.items():
                  p=wd/path;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
              run('add','--',ROOT)
              diff=subprocess.run(['git','-C',str(wd),'diff','--cached','--quiet'],capture_output=True)
              if diff.returncode==0:print('Evidence already identical');break
              run('commit','-m','research(cannabis): publish '+cfg['mode']+' public evidence')
              push=subprocess.run(['git','-C',str(wd),'push','origin','HEAD:main'],env=env,capture_output=True,text=True,timeout=150)
              if push.returncode==0:print('Published',len(outputs),'files at',run('rev-parse','HEAD').strip());break
              time.sleep(2)
          else:raise RuntimeError('Could not fast-forward main; evidence remains in artifact')
          PY
      - name: Preserve evidence even if publication fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cannabis-public-evidence-${{ github.run_id }}
          path: /tmp/cannabis-evidence/
          if-no-files-found: warn
          retention-days: 7
