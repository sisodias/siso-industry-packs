name: Community owners bounded source collection
on:
  push:
    branches: [research/community-owners-20260913]
    paths: [.github/workflows/community-owners-evidence-fast.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read public source documents in bounded batches
        env:
          GH_RESEARCH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,concurrent.futures,hashlib,time
          from pathlib import Path
          from datetime import datetime,timezone
          O=Path('evidence');O.mkdir(); token=os.environ['GH_RESEARCH_TOKEN']
          names='''chatwoot/chatwoot freescout-help-desk/freescout zammad/zammad uvdesk/community-skeleton osTicket/osTicket frappe/helpdesk papercups-io/papercups modmail-dev/Modmail erxes/erxes mautrix/whatsapp strangerstudios/paid-memberships-pro strangerstudios/pmpro-buddypress strangerstudios/pmpro-woocommerce strangerstudios/pmpro-approvals strangerstudios/pmpro-invite-only discourse/discourse-subscriptions civicrm/civicrm-core Admidio/admidio galette/galette killbill/killbill getlago/lago laravel/cashier-stripe stripe/stripe-node woocommerce/woocommerce WordPress/WordPress discourse/discourse flarum/framework NodeBB/NodeBB humhub/humhub Elgg/Elgg buddypress/buddypress buddyboss/buddyboss-platform phpbb/phpbb mybb/mybb SimpleMachines/SMF vanilla/vanilla apache/answer zulip/zulip RocketChat/Rocket.Chat mattermost/mattermost element-hq/synapse formbricks/formbricks LimeSurvey/LimeSurvey formio/formio ohmyform/ohmyform nocodb/nocodb directus/directus activepieces/activepieces keycloak/keycloak discourse/discourse-gamification discourse/discourse-solved discourse/discourse-chat-integration discourse/discourse-openid-connect discourse/discourse-oauth2-basic matrix-org/matrix-spec discord/discord-api-docs discordjs/discord.js jitsi/jitsi-meet jitsi/docker-jitsi-meet bigbluebutton/bigbluebutton bigbluebutton/greenlight livekit/livekit owncast/owncast pretix/pretix pretalx/pretalx HiEventsDev/hi.events alfio-event/alf.io calcom/cal.com gettogethercomm/GetTogether agorakit/agorakit discourse/discourse-calendar sabre-io/vobject icalendar/icalendar TryGhost/Ghost frappe/lms moodle/moodle openedx/edx-platform chamilo/chamilo-lms BookStackApp/BookStack outline/outline Chocobozzz/PeerTube LearningLocker/learninglocker adlnet/xAPI-Spec RusticiSoftware/TinCanJS H5P/h5p-php-library knadh/listmonk mautic/mautic Mailtrain-org/mailtrain dittofeed/dittofeed useplunk/plunk postalserver/postal plausible/analytics umami-software/umami PostHog/posthog metabase/metabase gitroomhq/postiz-app dubinc/dub shlinkio/shlink strangerstudios/pmpro-affiliates itthinx/affiliates frappe/erpnext Dolibarr/dolibarr akaunting/akaunting InvoicePlane/InvoicePlane invoiceninja/invoiceninja bigcapitalhq/bigcapital firefly-iii/firefly-iii ledger/ledger ofxparse/ofxparse restic/restic caddyserver/caddy awesome-selfhosted/awesome-selfhosted kdeldycke/awesome-billing'''.split()
          def request(url,data=None,auth=False):
              h={'User-Agent':'SISO-public-research'}
              if auth:h['Authorization']='Bearer '+token
              if data is not None:h['Content-Type']='application/json';data=json.dumps(data).encode()
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=h,data=data),timeout=18) as r:return r.read().decode('utf-8')
              except Exception as e:return {'error':getattr(e,'code',type(e).__name__),'url':url}
          allmeta=[]
          for start in range(0,len(names),8):
              q=[]
              for i,n in enumerate(names[start:start+8]):
                  owner,name=n.split('/')
                  q.append('r%d: repository(owner:%s,name:%s){nameWithOwner url description isPrivate isArchived stargazerCount primaryLanguage{name} licenseInfo{spdxId} defaultBranchRef{name target{... on Commit{oid committedDate tree{entries{name type oid}}}}}}'%(i,json.dumps(owner),json.dumps(name)))
              raw=request('https://api.github.com/graphql',{'query':'query {'+' '.join(q)+'}'},True)
              d=json.loads(raw) if isinstance(raw,str) else raw
              (O/('meta-%03d.json'%start)).write_text(json.dumps(d,indent=2))
              for i,n in enumerate(names[start:start+8]):
                  m=d.get('data',{}).get('r%d'%i)
                  if m and not m.get('isPrivate'):allmeta.append(m)
              print('Public metadata batch',start,'total',len(allmeta),'errors',len(d.get('errors',[])),flush=True)
          def audit(m):
              n=m['nameWithOwner']; b=m['defaultBranchRef']; c=b['target'];entries=c['tree']['entries'];root={x['name'].lower():x['name'] for x in entries if x['type']=='blob'}
              docs={}
              for kind,keys in [('readme',['readme.md','readme.rst','readme','readme.markdown','readme.txt']),('license',['license','license.txt','license.md','copying','copying.txt','licence','licence.txt','license.rst'])]:
                  path=next((root[k] for k in keys if k in root),None)
                  url='https://raw.githubusercontent.com/'+n+'/'+c['oid']+'/'+path if path else None
                  text=request(url) if url else {'error':'no_matching_root_file'}
                  docs[kind]={'path':path,'url':url,'text':text if isinstance(text,str) else None,'error':text if isinstance(text,dict) else None}
              out={'metadata':m,'observed_at':datetime.now(timezone.utc).isoformat(),'documents':docs}
              (O/('repo-'+n.replace('/','__')+'.json')).write_text(json.dumps(out,indent=2));print('Read source',n,flush=True)
              return out
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as p:audits=list(p.map(audit,allmeta))
          (O/'audits-fast.json').write_text(json.dumps(audits,indent=2))
          pinraw=request('https://api.github.com/repos/sisodias/siso-repo-bank/commits/main',auth=True)
          pin=json.loads(pinraw).get('sha') if isinstance(pinraw,str) else None
          matchnames={n.lower() for n in names}|{m['nameWithOwner'].lower() for m in allmeta};matches={};stats={}
          for path in ['bank/bank_best.jsonl','capability-shelf/source-registry.jsonl','bank/bank_adoption_v2.jsonl','bank/bank_liftable_ranked.jsonl','bank/bank_contractcard.jsonl','bank/bank_capability_top.jsonl','bank/bank_capability.jsonl']:
              url='https://raw.githubusercontent.com/sisodias/siso-repo-bank/'+str(pin)+'/'+path;rows=[];count=0;digest=hashlib.sha256()
              try:
                  with urllib.request.urlopen(url,timeout=25) as response:
                      for line in response:
                          digest.update(line)
                          if not line.strip():continue
                          row=json.loads(line);count+=1
                          keys=[str(row.get(k,'')).lower().removeprefix('https://github.com/').rstrip('/') for k in ['full_name','repo','repo_full_name','repository','url']]
                          if any(k in matchnames for k in keys) or path.endswith(('bank_capability_top.jsonl','bank_capability.jsonl')):rows.append(row)
                  matches[path]=rows;stats[path]={'rows_scanned':count,'matches':len(rows),'sha256':digest.hexdigest(),'source_url':url}
              except Exception as e:stats[path]={'error':str(type(e).__name__),'rows_scanned':count,'source_url':url}
              (O/'bank-matches-fast.json').write_text(json.dumps({'pin':pin,'matches':matches,'stats':stats},indent=2))
          print('Finished public-source collection',len(audits),flush=True)
          PY
      - name: Preserve collected public evidence even after partial failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: community-owners-bounded-evidence
          path: evidence/
          retention-days: 7
          if-no-files-found: error
