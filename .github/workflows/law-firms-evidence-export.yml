name: Law firms public evidence export
on:
  push:
    branches: [main]
    paths: [.github/workflows/law-firms-evidence-export.yml]
permissions:
  contents: read
concurrency:
  group: law-firms-evidence-export
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Package existing public research without executing candidate code
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures,hashlib,json,pathlib,urllib.request
          root=pathlib.Path('law-firms-evidence-export'); root.mkdir()
          rev='03115c3dbe4d03a211d7be9d4cb8a45c6d8bd560'
          base='https://raw.githubusercontent.com/sisodias/siso-industry-packs/'+rev+'/'
          pack='packs/law_firms/'
          files=[pack+p for p in ['01-person.md','02-workflow.md','02-workflow.json','03-companies.md','06-value.md']]
          files += [pack+'evidence/repo-%03d.json'%i for i in range(1,157)]
          files += [pack+'evidence/batch-%02d-review.jsonl'%i for i in range(1,27)]
          files += [pack+'evidence/batch-%02d-receipt.json'%i for i in range(1,27)]
          files += [pack+'evidence/search-round-%02d.json'%i for i in range(1,6)]
          files += [pack+'evidence/'+p for p in ['bank-receipt.json','bank-best-law.jsonl','bank-shelf-law.jsonl']]
          files += ['registry/industries.jsonl','registry/bank-submissions.jsonl','registry/corrections.jsonl']
          def copy(p):
              u=base+p
              with urllib.request.urlopen(u,timeout=45) as r: b=r.read()
              out=root/p;out.parent.mkdir(parents=True,exist_ok=True);out.write_bytes(b)
              return {'path':p,'source_url':u,'sha256':hashlib.sha256(b).hexdigest()}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
              manifest=list(ex.map(copy,files))
          rows=[]
          for p in sorted((root/pack/'evidence').glob('batch-*-review.jsonl')):
              rows += [json.loads(s) for s in p.read_text().splitlines() if s.strip()]
          good=[r for r in rows if r.get('full_name') and r.get('revision') and not r.get('retrieval_error')]
          summary={'pinned_source_revision':rev,'source_files':len(manifest),'requested':len(rows),'unique_successful_repositories':len({r['full_name'].lower() for r in good}),'already_in_bank':sum(r.get('bank_status')=='ALREADY IN THE BANK' for r in good),'new':sum(r.get('bank_status')=='NEW' for r in good),'scope':'Existing public text evidence only. No application code executed, no client data, no deployment, no production admission.'}
          (root/'EXPORT-MANIFEST.json').write_text(json.dumps({'summary':summary,'files':manifest},indent=2)+'\n')
          print('EXPORT_SUMMARY',json.dumps(summary))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: law-firms-public-evidence
          path: law-firms-evidence-export/
          if-no-files-found: error
          retention-days: 7
