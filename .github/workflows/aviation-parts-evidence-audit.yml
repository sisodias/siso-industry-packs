name: Aviation parts public evidence audit
on:
  push:
    branches: [main]
    paths: [packs/aviation_parts_distribution/evidence/audit-request.json]
permissions:
  contents: write
concurrency:
  group: aviation-parts-evidence-audit
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      REQUEST_REVISION: ${{ github.sha }}
    steps:
      - name: Retrieve public text and publish only aviation research
        shell: bash
        run: |
          python3 -u - <<'PY'
          import base64,concurrent.futures,datetime,hashlib,json,os,re,time,threading,urllib.request,urllib.error,urllib.parse
          REPO='sisodias/siso-industry-packs'; API='https://api.github.com'; ROOT='packs/aviation_parts_distribution/evidence/'
          assert os.environ['GH_REPOSITORY']==REPO
          NOW=datetime.datetime.now(datetime.timezone.utc).isoformat(); TOKEN=os.environ['GH_TOKEN']; outputs={}; lock=threading.Lock(); next_call=0
          def api(path,data=None,method=None):
              global next_call
              assert path.startswith('/') and not path.startswith('//')
              for attempt in range(3):
                  with lock:
                      time.sleep(max(0,next_call-time.monotonic()));next_call=time.monotonic()+0.42
                  req=urllib.request.Request(API+path,data=None if data is None else json.dumps(data).encode(),method=method,headers={'Authorization':'Bearer '+TOKEN,'Accept':'application/vnd.github+json','User-Agent':'siso-aviation-public-research','X-GitHub-Api-Version':'2022-11-28'})
                  try:
                      with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
                  except urllib.error.HTTPError as e:
                      text=e.read().decode('utf-8','replace')[:400]
                      if e.code in (403,429,500,502,503,504) and attempt<2:
                          delay=max(60,int(e.headers.get('Retry-After','60')))
                          if e.headers.get('X-RateLimit-Remaining')=='0':delay=max(delay,int(e.headers.get('X-RateLimit-Reset','0'))-int(time.time())+2)
                          if delay>180:return {'_error':e.code,'message':text,'retry_delay_seconds':delay}
                          print('Retry',e.code,path,'after',delay,'seconds',flush=True);time.sleep(delay);continue
                      return {'_error':e.code,'message':text}
                  except Exception as e:
                      if attempt<2:time.sleep(3);continue
                      return {'_error':type(e).__name__}
          def output(name,value):
              assert re.fullmatch(r'[A-Za-z0-9_.-]+',name)
              outputs[ROOT+name]=value if isinstance(value,str) else json.dumps(value,ensure_ascii=False,indent=2)+'\n'
          req=api('/repos/'+REPO+'/contents/'+ROOT+'audit-request.json?ref='+os.environ['REQUEST_REVISION'])
          cfg=json.loads(base64.b64decode(req['content']));assert cfg['mode'] in ('search','candidates')
          if cfg['mode']=='search':
              assert 1<=len(cfg['queries'])<=60
              records=[];known=set(n.lower() for n in cfg.get('previously_seen',[]));added=set()
              for q in cfg['queries']:
                  assert 1<=q.get('per_page',8)<=30
                  path='/search/repositories?'+urllib.parse.urlencode({'q':q['query'],'sort':'stars','order':'desc','per_page':q.get('per_page',8),'page':q.get('page',1)})
                  result=api(path);row={**q,'observed_at':NOW,'source_url':API+path,'total_count':result.get('total_count'),'incomplete_results':result.get('incomplete_results'),'error':result.get('_error'),'error_detail':result.get('message'),'results':[],'new_names':[]}
                  for r in result.get('items',[]):
                      n=r['full_name'];row['results'].append({k:r.get(k) for k in ('full_name','description','html_url','stargazers_count','archived','pushed_at','license','topics')})
                      if n.lower() not in known:known.add(n.lower());added.add(n);row['new_names'].append(n)
                  records.append(row);print('SEARCH_RECEIPT',json.dumps(row,ensure_ascii=False),flush=True);time.sleep(3.2)
              rnd=str(cfg['round']).zfill(2)
              output('search-round-'+rnd+'.json',{'round':cfg['round'],'observed_at':NOW,'queries':records,'unique_new_count':len(added),'new_names':sorted(added),'query_errors':sum(bool(r['error']) for r in records),'dry_round':len(added)==0 and all(not r['error'] for r in records),'scope':'bounded pages, not exhaustive GitHub enumeration'})
              output('search-round-'+rnd+'-brief.jsonl',''.join(json.dumps({k:v for k,v in r.items() if k!='results'}|{'hits':[(x['full_name'],x['stargazers_count'],x['description']) for x in r['results']]},ensure_ascii=False)+'\n' for r in records))
          else:
              names=list(dict.fromkeys(cfg['repositories']));assert 1<=len(names)<=180
              assert all(re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',n) for n in names)
              def decode(obj,n,rev):
                  if not obj.get('content'):return {'error':obj.get('_error','empty')}
                  b=base64.b64decode(obj['content']);t=b.decode('utf-8','replace')
                  return {'path':obj['path'],'sha256':hashlib.sha256(b).hexdigest(),'text':t,'characters':len(t),'source_url':'https://github.com/'+n+'/blob/'+str(rev)+'/'+obj['path']}
              def collect(pair):
                  number,name=pair;out={'audit_id':'R'+str(number).zfill(3),'requested_full_name':name,'observed_at':NOW};m=api('/repos/'+name)
                  if '_error' in m:return out|{'retrieval_error':m}
                  assert not m['private'];n=m['full_name'];b='/repos/'+n
                  out.update({k:m.get(k) for k in ('full_name','html_url','description','stargazers_count','forks_count','default_branch','archived','disabled','pushed_at','size','open_issues_count','topics','license')})
                  cs=api(b+'/commits?per_page=100');rev=cs[0]['sha'] if isinstance(cs,list) and cs else None
                  out['revision']=rev;out['last_commit']=cs[0]['commit']['committer']['date'] if rev else None
                  out['sources']={'repository':API+b,'commit':cs[0]['html_url'] if rev else None}
                  out['commits_six_months_sample_count']=sum(c['commit']['committer']['date']>='2026-03-13T00:00:00Z' for c in cs) if isinstance(cs,list) else None
                  out['commits_six_months_capped']=isinstance(cs,list) and len(cs)==100 and cs[-1]['commit']['committer']['date']>='2026-03-13T00:00:00Z'
                  suffix='?ref='+rev if rev else ''
                  out['readme']=decode(api(b+'/readme'+suffix),n,rev)
                  li=api(b+'/license'+suffix);out['license_file']=decode(li,n,rev);out['license_file']['detected']=li.get('license')
                  people=api(b+'/contributors?per_page=10');out['contributors_top10']=[{'login':p.get('login'),'contributions':p.get('contributions')} for p in people] if isinstance(people,list) else None
                  out['bus_factor']='not_measured; contributors are not maintainership redundancy'
                  issues=api(b+'/issues?state=all&sort=updated&direction=desc&per_page=10')
                  out['issues_sample']=[{k:i.get(k) for k in ('number','title','state','created_at','updated_at','closed_at','comments','html_url','author_association')} for i in issues if 'pull_request' not in i][:3] if isinstance(issues,list) else None
                  out['issue_response_sample']=[]
                  print('RETRIEVED',number,n,'readme',bool(out['readme'].get('text')),'license',bool(out['license_file'].get('text')),flush=True)
                  return out
              with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:rows=list(pool.map(collect,enumerate(names,1)))
              bankrepo='sisodias/siso-repo-bank';head=api('/repos/'+bankrepo+'/commits/main')['sha'];bank={};wanted={n.lower() for n in names}|{r['full_name'].lower() for r in rows if r.get('full_name')}
              receipt={'observed_at':NOW,'bank_revision':head,'files':[],'upstream_execution':'none','bank_read_mode':'stream JSONL and retain exact candidate matches only'}
              def fullname(r):
                  for key in ('full_name','repo_full_name','repository_full_name','repository','repo','name','url','repo_url','repository_url','source_url'):
                      v=r.get(key)
                      if isinstance(v,str):
                          v=v.removeprefix('https://github.com/').removesuffix('.git').strip('/')
                          if re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',v):return v.lower()
                  return None
              files=['bank/bank_capability_top.jsonl','bank/bank_capability.jsonl','capability-shelf/source-registry.jsonl','bank/bank_best.jsonl','bank/bank_adoption_v2.jsonl','bank/bank_liftable_ranked.jsonl','bank/bank_contractcard.jsonl']
              for path in files:
                  url='https://raw.githubusercontent.com/'+bankrepo+'/'+head+'/'+path;idx={};count=0;digest=hashlib.sha256()
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'siso-aviation-public-research'}),timeout=90) as stream:
                      for line in stream:
                          digest.update(line)
                          if not line.strip():continue
                          r=json.loads(line);count+=1;n=fullname(r)
                          if n in wanted:idx.setdefault(n,[]).append(r)
                  bank[path]=idx;receipt['files'].append({'path':path,'rows':count,'sha256':digest.hexdigest(),'source_url':'https://github.com/'+bankrepo+'/blob/'+head+'/'+path})
              review=[]
              for i,r in enumerate(rows,1):
                  aliases={r['requested_full_name'].lower(),r.get('full_name','').lower()};r['bank_revision']=head
                  r['bank_rows']={p:[x for a in aliases for x in idx.get(a,[])] for p,idx in bank.items() if p!='bank/bank_capability.jsonl'}
                  r['bank_membership_layers']=[p for p,x in r['bank_rows'].items() if x];r['bank_status']='ALREADY IN THE BANK' if r['bank_membership_layers'] else 'NEW';r['adoption_evidence']=r['bank_rows'].get('bank/bank_adoption_v2.jsonl',[])
                  rm=r.get('readme',{});li=r.get('license_file',{})
                  r['readme']={k:v for k,v in rm.items() if k!='text'}|{'excerpt':rm.get('text','')[:6000]}
                  r['license_file']={k:v for k,v in li.items() if k!='text'}|{'excerpt':li.get('text','')[:1800],'tail':li.get('text','')[-600:]}
                  output('repo-'+str(i).zfill(3)+'.json',r)
                  s={k:r.get(k) for k in ('audit_id','full_name','description','stargazers_count','archived','last_commit','revision','license','commits_six_months_sample_count','commits_six_months_capped','bank_status','bank_membership_layers','adoption_evidence','retrieval_error')}
                  s.update({'readme_excerpt':rm.get('text','')[:2200],'readme_source':rm.get('source_url'),'license_excerpt':li.get('text','')[:650],'license_source':li.get('source_url'),'license_error':li.get('error'),'top_contributor_count':len(r.get('contributors_top10') or [])});review.append(s)
                  print('REVIEW_RECEIPT',json.dumps(s,ensure_ascii=False),flush=True)
              for start in range(0,len(review),5):output('review-'+str(start//5+1).zfill(2)+'.jsonl',''.join(json.dumps(x,ensure_ascii=False)+'\n' for x in review[start:start+5]))
              output('candidate-index.jsonl',''.join(json.dumps({k:v for k,v in x.items() if k not in ('readme_excerpt','license_excerpt','adoption_evidence')},ensure_ascii=False)+'\n' for x in review))
              receipt.update({'requested':len(names),'repositories_retrieved':sum(bool(r.get('full_name')) for r in rows),'readmes_retrieved':sum(bool(r.get('readme',{}).get('excerpt')) for r in rows),'license_files_retrieved':sum(bool(r.get('license_file',{}).get('excerpt')) for r in rows),'current_commit_retrieved':sum(bool(r.get('revision')) for r in rows),'already_in_bank':sum(r.get('bank_status')=='ALREADY IN THE BANK' for r in rows),'new':sum(r.get('bank_status')=='NEW' for r in rows),'membership_definition':'Any match in six repo-bank layers; source-shelf candidates are held, not admitted'})
              output('candidate-audit-receipt.json',receipt)
          for attempt in range(5):
              ref=api('/repos/'+REPO+'/git/ref/heads/main')
              if 'object' not in ref:raise RuntimeError('PUBLIC_RECEIPTS_PRINTED_BUT_REF_READ_FAILED '+json.dumps(ref))
              parent=ref['object']['sha'];commit=api('/repos/'+REPO+'/git/commits/'+parent)
              tree=api('/repos/'+REPO+'/git/trees',{'base_tree':commit['tree']['sha'],'tree':[{'path':p,'mode':'100644','type':'blob','content':t} for p,t in outputs.items()]},'POST')
              if '_error' in tree:raise RuntimeError('tree write failed '+json.dumps(tree))
              c=api('/repos/'+REPO+'/git/commits',{'message':'research(aviation): publish '+cfg['mode']+' public evidence','tree':tree['sha'],'parents':[parent]},'POST')
              result=api('/repos/'+REPO+'/git/refs/heads/main',{'sha':c['sha'],'force':False},'PATCH')
              if '_error' not in result:print('PUBLISHED',len(outputs),c['sha'],flush=True);break
              if result['_error'] not in (409,422):raise RuntimeError('nonforce publication failed '+json.dumps(result))
          else:raise RuntimeError('Concurrent edits prevented publication; receipts remain in logs')
          PY
