name: YouTube research pack validation
on:
  push:
    branches: [research/youtube-creators-20260913]
    paths:
      - .github/workflows/youtube-materialize.yml
      - research-tools/youtube-materialize.py
permissions:
  contents: write
  actions: read
concurrency:
  group: youtube-research-materialize
  cancel-in-progress: false
jobs:
  materialize-public-research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use exact scoped tree identity rather than a truncated global diff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('research-tools/youtube-materialize.py')
          source=p.read_text()
          old="mainchanges=api('/repos/'+REPO+'/compare/'+mergebase+'...'+main).get('files',[])\nassert len(mainchanges)<300,'main comparison may be truncated'\nassert not any(x['filename'].startswith(PACK) for x in mainchanges),'main changed this pack: human reconciliation required'"
          new="def pack_identity(ref):\n    entries=api('/repos/'+REPO+'/contents/'+PACK.rstrip('/')+'?ref='+ref)\n    assert isinstance(entries,list),'pack directory read failed'\n    return sorted((x['name'],x['type'],x['sha']) for x in entries)\nassert pack_identity(mergebase)==pack_identity(main),'main changed this pack: human reconciliation required'"
          if old in source:
              assert source.count(old)==1
              p.write_text(source.replace(old,new))
          else:
              assert new in source,'unexpected source; stop without mutation'
          PY
      - name: Join reviewed public evidence and preserve unrelated main changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 research-tools/youtube-materialize.py
      - name: Preserve validation and downloadable research pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-creators-research-pack
          path: |
            youtube-creators-research-pack.zip
            youtube-publication-receipt.json
            packs/youtube_creators/
          if-no-files-found: warn
          retention-days: 30
