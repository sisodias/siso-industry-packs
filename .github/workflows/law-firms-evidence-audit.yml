              output('search-round-'+rnd+'.json',{'round':cfg['round'],'observed_at':NOW,'prior_rounds_read':prior,'queries':records,'unique_new_count':len(added),'new_names':sorted(added),'sort':'stars descending; bounded pages, not exhaustive GitHub enumeration'})
              output('search-round-'+rnd+'-brief.jsonl',''.join(json.dumps({k:v for k,v in r.items() if k!='results'}|{'hits':[(x['full_name'],x['stargazers_count'],(x['description'] or '')[:300]) for x in r['results']]},ensure_ascii=False)+'\n' for r in records))
          elif cfg['mode']=='candidates':
              bankrepo='sisodias/siso-repo-bank';head=api('/repos/'+bankrepo+'/commits/main')['sha'];files=['bank/bank_capability_top.jsonl','bank/bank_capability.jsonl','capability-shelf/source-registry.jsonl','bank/bank_best.jsonl','bank/bank_adoption_v2.jsonl','bank/bank_liftable_ranked.jsonl','bank/bank_contractcard.jsonl']
              bank={};receipt={'observed_at':NOW,'bank_repository':bankrepo,'bank_revision':head,'files':[],'upstream_execution':'none; public text/data retrieval only'}
              def fullname(row):
                  for key in ('full_name','repo_full_name','repository_full_name','repository','repo','name','url','repo_url','repository_url','source_url'):
                      v=row.get(key)
                      if isinstance(v,str):
                          v=v.removeprefix('https://github.com/').removesuffix('.git').strip('/')
                          if re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',v):return v.lower()
                  return None
              for path in files:
                  b=raw(bankrepo,head,path)
                  if b is None:raise RuntimeError('bank source unavailable: '+path)
                  rows=[json.loads(x) for x in b.splitlines() if x.strip()];idx={}
                  for row in rows:
                      n=fullname(row)
                      if n:idx.setdefault(n,[]).append(row)
                  bank[path]=idx;receipt['files'].append({'path':path,'rows':len(rows),'sha256':hashlib.sha256(b).hexdigest(),'source_url':'https://github.com/'+bankrepo+'/blob/'+head+'/'+path})
              names=list(dict.fromkeys(cfg['repositories']));assert 1<=len(names)<=220
              assert all(re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',n) for n in names)
              def decode_file(obj,canonical,rev):
