name: Law firms public evidence audit
on:
  push:
    branches: [main]
    paths: [packs/law_firms/evidence/audit-request.json]
permissions:
  contents: write
concurrency:
  group: law-firms-evidence-audit
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      REQUEST_REVISION: ${{ github.sha }}
    steps:
      - name: Retrieve public text and assemble research only
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, concurrent.futures, datetime, hashlib, json, os, re, time, urllib.request, urllib.error, urllib.parse
