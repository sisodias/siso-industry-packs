                  people=api(base+'/contributors?per_page=10');out['contributors_top10']=[{'login':p.get('login'),'contributions':p.get('contributions')} for p in people] if isinstance(people,list) else None;out['bus_factor']='not_measured; contributors are not maintainership redundancy'
                  issues=api(base+'/issues?state=all&sort=updated&direction=desc&per_page=10');out['issues_sample']=[{k:i.get(k) for k in ('number','title','state','created_at','updated_at','closed_at','comments','html_url','author_association')} for i in issues if 'pull_request' not in i][:3] if isinstance(issues,list) else None
                  replies=[]
                  for issue in (out.get('issues_sample') or [])[:1]:
                      if issue['comments']:
                          comments=api(base+'/issues/'+str(issue['number'])+'/comments?per_page=20')
                          if isinstance(comments,list):
                              owned=[c for c in comments if c.get('author_association') in ('OWNER','MEMBER','COLLABORATOR')]
                              if owned:replies.append({'issue':issue['number'],'created_at':issue['created_at'],'first_affiliated_reply_in_sample':owned[0]['created_at'],'source_url':owned[0]['html_url']})
                  out['issue_response_sample']=replies;aliases={name.lower(),n.lower()};out['bank_rows']={p:[r for a in aliases for r in idx.get(a,[])] for p,idx in bank.items() if p!='bank/bank_capability.jsonl'};out['bank_membership_layers']=[p for p,rows in out['bank_rows'].items() if rows];out['bank_status']='ALREADY IN THE BANK' if out['bank_membership_layers'] else 'NEW';out['adoption_evidence']=out['bank_rows'].get('bank/bank_adoption_v2.jsonl',[])
                  return out
              with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:rows=list(pool.map(collect,enumerate(names,1)))
              review=[]
              for i,r in enumerate(rows,1):
                  output('repo-'+str(i).zfill(3)+'.json',r)
                  small={k:r.get(k) for k in ('audit_id','full_name','description','stargazers_count','archived','last_commit','revision','license','commits_six_months_sample_count','commits_six_months_capped','bank_status','bank_membership_layers','adoption_evidence','retrieval_error')};small['description']=(small.get('description') or '')[:350]
                  readme=r.get('readme',{});lic=r.get('license_file',{});small['readme_excerpt']=readme.get('text','')[:2800];small['readme_characters']=readme.get('characters');small['readme_source']=readme.get('source_url');small['license_excerpt']=lic.get('text','')[:650];small['license_source']=lic.get('source_url');small['license_error']=lic.get('error');small['issue_response_sample']=r.get('issue_response_sample');small['top_contributor_count']=len(r.get('contributors_top10') or []);review.append(small)
              for start in range(0,len(review),4):output('review-'+str(start//4+1).zfill(2)+'.jsonl',''.join(json.dumps(x,ensure_ascii=False)+'\n' for x in review[start:start+4]))
              receipt.update({'requested':len(names),'repositories_retrieved':sum(bool(r.get('full_name')) for r in rows),'readmes_retrieved':sum(bool(r.get('readme',{}).get('text')) for r in rows),'license_files_retrieved':sum(bool(r.get('license_file',{}).get('text')) for r in rows),'current_commit_retrieved':sum(bool(r.get('revision')) for r in rows),'already_in_bank':sum(r.get('bank_status')=='ALREADY IN THE BANK' for r in rows),'new':sum(r.get('bank_status')=='NEW' for r in rows),'membership_definition':'Any match in the six indexed repo-bank layers; shelf candidates are already held but not admitted'})
              output('candidate-audit-receipt.json',receipt)
          else:
