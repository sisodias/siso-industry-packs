              def collect(pair):
                  number,name=pair;out={'audit_id':'R'+str(number).zfill(3),'requested_full_name':name,'observed_at':NOW,'bank_revision':head};m=api('/repos/'+name)
                  if '_error' in m:return out|{'retrieval_error':m['_error']}
                  n=m['full_name'];base='/repos/'+n
