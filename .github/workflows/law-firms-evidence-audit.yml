                  doc+='| '+r['audit_id']+' ['+r['full_name']+']('+r['url']+') | '+r['bank_status']+'<br>'+esc(r['capability'])+' | '+str(r['stars'])+'<br>'+r['observed_at'][:10]+' | ['+esc(label)+']('+source+')<br>['+r['last_commit']+']('+r['evidence_url']+') | '+score+' | **'+r['verdict']+'** — '+esc(r['what'])+' |\n'
              doc+='\n## Per-repository reuse, self-hosting and rejection notes\n\n[analysis] Resource figures below are planning hypotheses unless a pinned upstream source is explicitly identified; no load or restore test was run. All ADOPT items still require scoped rights, security, statement/workflow fidelity and export tests.\n'
