name: Law firms public evidence audit
on:
  push:
    branches: [main]
    paths: [packs/law_firms/evidence/audit-request.json]
permissions:
  contents: write
concurrency:
  group: law-firms-evidence-audit
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      REQUEST_REVISION: ${{ github.sha }}
    steps:
      - name: Run pinned public-research collector, with safe diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, os, textwrap
          assert os.environ['GH_REPOSITORY']=='sisodias/siso-industry-packs'
          # This is our own previously published research collector, not candidate application code.
          source='https://raw.githubusercontent.com/sisodias/siso-industry-packs/d4c6202396dc4230a080831a326f0623e2f05061/.github/workflows/law-firms-evidence-audit.yml'
          with urllib.request.urlopen(source,timeout=60) as response: text=response.read().decode()
          script=textwrap.dedent(text.split("          python3 - <<'PY'\n",1)[1].rsplit('          PY',1)[0])
          needle="except urllib.error.HTTPError as e:\n            if e.code"
          replacement="except urllib.error.HTTPError as e:\n            print('PUBLIC_RESEARCH_HTTP_ERROR', e.code, path.split('?')[0], 'remaining', e.headers.get('X-RateLimit-Remaining'), 'reset', e.headers.get('X-RateLimit-Reset'))\n            if e.code"
          assert needle in script
          script=script.replace(needle,replacement,1)
          # Preserve generated evidence in logs before publication, so a write failure cannot masquerade as an empty search.
          needle2='# Safe fast-forward, evidence/report paths only; unrelated files remain untouched.'
          assert needle2 in script
          script=script.replace(needle2,"for p,t in outputs.items():\n    if p.endswith('-brief.jsonl') or p.endswith('receipt.json'):\n        print('EVIDENCE_RECEIPT',p,t)\n"+needle2,1)
          exec(compile(script,source,'exec'),{'__name__':'__main__'})
          PY
