                  r=json.loads(raw(REPO,os.environ['REQUEST_REVISION'],ROOT+'repo-'+note['audit_id'][1:]+'.json'))
                  assert r.get('full_name') and r.get('revision') and r.get('readme',{}).get('text')
                  assert note['verdict'] in ('ADOPT','STEAL','STUDY','SKIP')
                  scores=note['scores'];assert set(scores)=={'fit','liftability','health','adoption','integration'} and all(isinstance(v,int) and 0<=v<=5 for v in scores.values())
                  lic=r.get('license_file',{});rootlabel=(lic.get('detected') or {}).get('spdx_id') or (r.get('license') or {}).get('spdx_id') or 'NOASSERTION'
                  final.append({**note,'full_name':r['full_name'],'url':r['html_url'],'stars':r['stargazers_count'],'observed_at':r['observed_at'],'last_commit':r['last_commit'],'revision':r['revision'],'archived':r['archived'],'license_detected':rootlabel,'license_file_verified':bool(lic.get('text')),'license_file_url':lic.get('source_url'),'license_file_sha256':lic.get('sha256'),'bank_status':r['bank_status'],'bank_revision':r['bank_revision'],'bank_membership_layers':r['bank_membership_layers'],'adoption_evidence':r.get('adoption_evidence',[]),'commits_six_months_sample_count':r.get('commits_six_months_sample_count'),'commits_six_months_capped':r.get('commits_six_months_capped'),'issue_response_sample':r.get('issue_response_sample'),'bus_factor':r.get('bus_factor'),'readme_source':r['readme']['source_url'],'evidence_url':'https://github.com/'+REPO+'/blob/'+os.environ['REQUEST_REVISION']+'/'+ROOT+'repo-'+note['audit_id'][1:]+'.json','evidence_class':'vendor: upstream self-description and GitHub metadata; analysis: scores, fit, reuse and verdict'})
              assert len({r['full_name'].lower() for r in final})==len(final)
              counts={'repos_examined':len(final),'repos_adopted':sum(r['verdict']=='ADOPT' for r in final),'verdicts':{v:sum(r['verdict']==v for r in final) for v in ('ADOPT','STEAL','STUDY','SKIP')},'already_in_bank':sum(r['bank_status']=='ALREADY IN THE BANK' for r in final),'new':sum(r['bank_status']=='NEW' for r in final),'license_files_verified':sum(r['license_file_verified'] for r in final),'observed_at':NOW,'research_only':True,'application_code_written':False,'deployments_tested':0}
              rounds=[];seen=set()
              for number in range(1,16):
                  b=raw(REPO,os.environ['REQUEST_REVISION'],ROOT+'search-round-'+str(number).zfill(2)+'.json')
                  if not b:break
                  obj=json.loads(b);names={x['full_name'].lower() for q in obj['queries'] for x in q.get('results',[])};new=names-seen;seen.update(names)
                  rounds.append({'round':number,'queries':len(obj['queries']),'new_unique_repositories':len(new),'returned_unique':len(names),'errors':sum(q.get('error') is not None for q in obj['queries']),'source':'evidence/search-round-'+str(number).zfill(2)+'.json'})
              counts['search_rounds']=rounds;counts['discovered_unique']=len(seen);counts['two_final_zero_new_rounds']=len(rounds)>=3 and all(x['new_unique_repositories']==0 and x['errors']==0 for x in rounds[-2:]);output('research-counts.json',counts)
              doc=assessments['preamble_markdown']+'\n\n## Actual funnel\n\n[analysis] '+str(len(final))+' distinct repositories examined; '+str(counts['already_in_bank'])+' ALREADY IN THE BANK; '+str(counts['new'])+' NEW. Verdicts: '+', '.join(str(counts['verdicts'][v])+' '+v for v in counts['verdicts'])+'. Actual LICENSE text retrieved for '+str(counts['license_files_verified'])+'; absence/undetected or scoped licences are explicitly noted. No upstream code was executed.\n\n| Round | Queries | New unique names | Returned unique names | Errors | Receipt |\n|---|---:|---:|---:|---:|---|\n'
              for x in rounds:doc+='| '+str(x['round'])+' | '+str(x['queries'])+' | '+str(x['new_unique_repositories'])+' | '+str(x['returned_unique'])+' | '+str(x['errors'])+' | [source]('+x['source']+') |\n'
              doc+='\n[analysis] Discovery is bounded to the logged queries/pages, not proof of exhaustive GitHub coverage. Irrelevant keyword hits were not padded into the examined list. The final two zero-new-round condition is **'+str(counts['two_final_zero_new_rounds'])+'**.\n\n## Deduplicated candidate table\n\n[analysis] Scores are **F/L/H/A/I**, each 0–5: fit / liftability / health evidence / adoption evidence / spine integration. Zero adoption evidence means unknown, not no users. “ADOPT” means selected for a gated pilot, never production admission. Every row links the pinned upstream evidence; mutable metadata is dated per record.\n\n| ID / repository | Bank status / capability | Stars / observed UTC | Root licence / last commit UTC | F/L/H/A/I | Verdict / what it gives us |\n|---|---|---|---|---|---|\n'
