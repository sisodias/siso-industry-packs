                  cs=api(base+'/commits?per_page=1');rev=cs[0]['sha'] if isinstance(cs,list) and cs else None
                  out['revision']=rev;out['last_commit']=cs[0]['commit']['committer']['date'] if rev else None;out['sources']={'repository':API+base,'commit':cs[0]['html_url'] if rev else None}
                  suffix='?ref='+rev if rev else ''
