name: SaaS base stack research receipts
on:
  push:
    branches: [research/saas-base-stack-20260913]
    paths: [.github/workflows/saas-base-stack-research-receipts.yml]
permissions:
  contents: read
concurrency:
  group: saas-base-stack-research-receipts
  cancel-in-progress: false
jobs:
  public-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Collect public source receipts without executing upstream projects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import ast, textwrap, urllib.request
          url='https://raw.githubusercontent.com/sisodias/siso-industry-packs/e9e428a722d926aa36edeb316e58fc1dfae5ee1d/.github/workflows/saas-base-stack-research-receipts.yml'
          with urllib.request.urlopen(url,timeout=30) as response:
              original=response.read().decode()
          body=original.split("          python3 - <<'PY'\n",1)[1].split('\n          PY\n',1)[0]
          code=textwrap.dedent(body)
          bad="out['sampled_author_logins']=sorted(set((c.get('author') or {}).get('login') for c in commits if (c.get('author') or {}).get('login'))"
          assert code.count(bad)==1
          code=code.replace(bad,bad+')').replace('data=r.read(12000000)','data=r.read()')
          ast.parse(code)
          print('Validated pinned SISO research collector; no upstream project code will execute.',flush=True)
          exec(compile(code,'pinned-siso-research-collector','exec'))
          PY
      - name: Preserve source receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: saas-base-stack-public-source-receipts
          path: receipts/
          if-no-files-found: error
          retention-days: 3
