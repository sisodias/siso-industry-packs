name: SaaS base stack research receipts
on:
  push:
    branches: [research/saas-base-stack-20260913]
    paths: [.github/workflows/saas-base-stack-research-receipts.yml]
permissions:
  contents: read
concurrency:
  group: saas-base-stack-research-receipts
  cancel-in-progress: false
jobs:
  public-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read public sources without executing upstream code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, concurrent.futures, datetime, hashlib, json, os, pathlib, re, time, urllib.error, urllib.parse, urllib.request
          P=pathlib.Path('receipts'); P.mkdir()
          NOW=datetime.datetime.now(datetime.timezone.utc).isoformat()
          PIN='2d7d35ecbf7e1158d0a3527e1489040687ac214b'
          errors=[]
          def save(path,data):
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          def get(url,raw=False):
              headers={'User-Agent':'siso-saas-research-only','Accept':'application/vnd.github+json'}
              if url.startswith('https://api.github.com/'):
                  headers['Authorization']='Bearer '+os.environ['GH_TOKEN']
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:
                          data=r.read(12000000)
                      return data if raw else json.loads(data)
                  except urllib.error.HTTPError as e:
                      if e.code in (403,429) and attempt<3:
                          time.sleep(65); continue
                      if e.code>=500 and attempt<3:
                          time.sleep(2**attempt); continue
                      raise RuntimeError('HTTP '+str(e.code)+' '+url) from None
                  except Exception:
                      if attempt==3: raise
                      time.sleep(2**attempt)
          def api(path): return get('https://api.github.com/'+path)
          banks={}; bank_receipts=[]; names=set(); bank_rows={}; shelf_rows={}; adoption={}; liftability={}; cards={}
          paths=['bank/bank_best.jsonl','capability-shelf/source-registry.jsonl','bank/bank_adoption_v2.jsonl','bank/bank_liftable_ranked.jsonl','bank/bank_contractcard.jsonl','bank/bank_capability.jsonl','bank/bank_capability_top.jsonl','bank/category.jsonl']
          def repo_name(row):
              for key in ('full_name','repository','repo','repo_full_name','repository_full_name'):
                  v=row.get(key)
                  if isinstance(v,str):
                      v=v.removeprefix('https://github.com/').strip('/')
                      if re.fullmatch(r'[^/\s]+/[^/\s]+',v): return v
              for key in ('url','source_url','repo_url','repository_url'):
                  v=row.get(key,'')
                  if isinstance(v,str):
                      m=re.match(r'https://github.com/([^/]+/[^/#?]+)',v)
                      if m:return m.group(1)
              return None
          membership_complete=True
          for path in paths:
              url='https://raw.githubusercontent.com/sisodias/siso-repo-bank/'+PIN+'/'+path
              try:
                  data=get(url,True)
                  rows=[json.loads(line) for line in data.decode().splitlines() if line.strip()]
                  entry={'path':path,'source_url':url,'pin':PIN,'rows':len(rows),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'git_blob_sha1':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest(),'complete':True}
                  bank_receipts.append(entry)
                  if path.endswith('bank_best.jsonl'):
                      bank_rows={repo_name(r).lower():r for r in rows if repo_name(r)}; names.update(bank_rows)
                  elif path.endswith('source-registry.jsonl'):
                      shelf_rows={repo_name(r).lower():r for r in rows if repo_name(r)}; names.update(shelf_rows)
                      stage_words=('billing','identity','content','customer','onboard','support','analytics','commerce','scheduling','accounting','workflow','backup')
                      sample=[r for r in rows if any(w in json.dumps(r).lower() for w in stage_words)]
                      save(P/'bank/product-shelf-relevant.json',sample)
                  elif 'adoption' in path:
                      adoption={repo_name(r).lower():r for r in rows if repo_name(r)}
                  elif 'liftable' in path:
                      liftability={repo_name(r).lower():r for r in rows if repo_name(r)}
                  elif 'contractcard' in path:
                      cards={repo_name(r).lower():r for r in rows if repo_name(r)}
                  else:save(P/('bank/'+path.split('/')[-1]+'.json'),rows)
                  del rows,data
              except Exception as e:
                  errors.append({'stage':'bank','path':path,'error':str(e)})
                  if path in paths[:2]: membership_complete=False
          if not bank_rows or not shelf_rows: membership_complete=False
          save(P/'bank/source-receipts.json',bank_receipts)
          save(P/'bank/membership-name-index.json',sorted(names))
          seeds={
          'W01':'TryGhost/Ghost payloadcms/payload strapi/strapi directus/directus WordPress/WordPress gohugoio/hugo withastro/astro facebook/docusaurus vuejs/vitepress mkdocs/mkdocs BookStackApp/BookStack outline/outline'.split(),
          'W02':'chatwoot/chatwoot freescout-help-desk/freescout zammad/zammad uvdesk/community-skeleton Chaskiq/chaskiq papercups-io/papercups erxes/erxes osTicket/osTicket helpyio/helpy frappe/helpdesk'.split(),
          'W03':'keycloak/keycloak goauthentik/authentik logto-io/logto zitadel/zitadel ory/kratos ory/hydra casdoor/casdoor supabase/supabase pocketbase/pocketbase supertokens/supertokens-core authelia/authelia dexidp/dex better-auth/better-auth panva/jose'.split(),
          'W04':'stripe/stripe-node killbill/killbill getlago/lago openmeterio/openmeter polar-sh/polar activemerchant/active_merchant medusajs/medusa saleor/saleor vendurehq/vendure spree/spree solidusio/solidus woocommerce/woocommerce sylius/sylius shopware/shopware'.split(),
          'W05':'calcom/cal.com calcom/cal.diy alextselegidis/easyappointments LibreBooking/app formbricks/formbricks LimeSurvey/LimeSurvey heyform/heyform ohmyform/ohmyform nocodb/nocodb baserow/baserow'.split(),
          'W06':'twentyhq/twenty frappe/crm knadh/listmonk postalserver/postal mailcow/mailcow-dockerized stalwartlabs/stalwart nodemailer/nodemailer resend/react-email frappe/erpnext odoo/odoo glpi-project/glpi appsmithorg/appsmith'.split(),
          'W07':'umami-software/umami plausible/analytics matomo-org/matomo PostHog/posthog metabase/metabase rudderlabs/rudder-server snowplow/snowplow growthbook/growthbook Unleash/unleash flagsmith/flagsmith flipt-io/flipt'.split(),
          'W08':'louislam/uptime-kuma TwiN/gatus healthchecks/healthchecks statping-ng/statping-ng upptime/upptime getsentry/self-hosted netdata/netdata grafana/grafana prometheus/prometheus activepieces/activepieces n8n-io/n8n windmill-labs/windmill makeplane/plane vikunja/vikunja'.split(),
          'W09':'invoiceninja/invoiceninja akaunting/akaunting bigcapitalhq/bigcapital dolibarr/dolibarr InvoicePlane/InvoicePlane firefly-iii/firefly-iii actualbudget/actual frappe/hrms'.split(),
          'W10':'restic/restic borgbackup/borg kopia/kopia pgbackrest/pgbackrest wal-g/wal-g caddyserver/caddy traefik/traefik oauth2-proxy/oauth2-proxy openfga/openfga'.split()}
          queries={
          'W01':['"headless cms" in:name,description','topic:cms','MDX frontmatter in:readme'],
          'W02':['"shared inbox" in:description','topic:customer-support','IMAP webhook in:readme'],
          'W03':['organization authentication in:description','topic:identity-provider','SCIM OIDC in:description,readme'],
          'W04':['"subscription billing" in:description','topic:billing','Stripe webhooks in:description'],
          'W05':['onboarding self-hosted in:description','topic:scheduling','CalDAV in:description'],
          'W06':['helpdesk in:name,description','topic:live-chat','JMAP in:description'],
          'W07':['"product analytics" in:description','topic:feedback','CloudEvents analytics in:readme'],
          'W08':['"status page" in:description','topic:uptime-monitor','OpenTelemetry OTLP in:description'],
          'W09':['invoicing self-hosted in:description','topic:accounting','OFX in:name,description'],
          'W10':['"data export" self-hosted in:description','topic:backup','SCIM deprovisioning in:readme']}
          inventory={}; searchlog=[]; rounds=[]; seen=set(names)
          for stage,rs in seeds.items():
              for r in rs: inventory[r.lower()]={'name':r,'stages':[stage],'discovery':['commercial-workflow-seed']}
          seen.update(inventory)
          for round_number in range(3):
              new=[]
              for stage,qs in queries.items():
                  query=qs[round_number]
                  url='https://api.github.com/search/repositories?'+urllib.parse.urlencode({'q':query,'sort':'stars','order':'desc','per_page':8})
                  try:
                      result=get(url); items=result.get('items',[])
                      row={'round':round_number+1,'lane':['keyword','topic','format-protocol'][round_number],'stage':stage,'query':query,'url':url,'sort':'stars-desc','result_window':8,'total_count':result.get('total_count'),'incomplete_results':result.get('incomplete_results'),'observed_at':NOW,'items':[]}
                      for r in items:
                          key=r['full_name'].lower()
                          row['items'].append({k:r.get(k) for k in ['id','full_name','html_url','description','stargazers_count','license','pushed_at','archived','language']})
                          if key not in seen:new.append(r['full_name']);seen.add(key)
                          if key not in inventory:inventory[key]={'name':r['full_name'],'stages':[stage],'discovery':[row['lane']]}
                          else:
                              inventory[key]['stages']=sorted(set(inventory[key]['stages']+[stage]))
                              inventory[key]['discovery']=sorted(set(inventory[key]['discovery']+[row['lane']]))
                      searchlog.append(row)
                  except Exception as e:errors.append({'stage':'search','query':query,'error':str(e)})
                  time.sleep(7)
              rounds.append({'round':round_number+1,'new_names_relative_to_bank_seeded_inventory':new,'new_count':len(new),'not_a_global_exhaustiveness_claim':True})
          save(P/'search/queries.json',searchlog);save(P/'search/rounds.json',rounds)
          save(P/'search/discovered-inventory.json',list(inventory.values()))
          selected=[]; chosen=set()
          for stage,rs in seeds.items():
              for r in rs:
                  if r.lower() not in chosen:selected.append(inventory[r.lower()]);chosen.add(r.lower())
          for r in inventory.values():
              if len(selected)>=130:break
              if r['name'].lower() not in chosen and 'format-protocol' in r['discovery']:
                  selected.append(r);chosen.add(r['name'].lower())
          def decode_file(data,path):
              body=base64.b64decode(data.get('content','')) if data.get('encoding')=='base64' else data.get('content','').encode()
              if not body:raise RuntimeError('No inline file body: '+str(data.get('path')))
              path.write_bytes(body)
              return {'path':data.get('path'),'sha':data.get('sha'),'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest(),'source_url':data.get('html_url')}
          def inspect(seed):
              input_name=seed['name'];out={'input_name':input_name,'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'stages':seed['stages'],'discovery':seed['discovery'],'errors':[]}
              try:
                  meta=api('repos/'+input_name);name=meta['full_name'];out['full_name']=name
                  out['metadata']={k:meta.get(k) for k in ['id','full_name','html_url','description','stargazers_count','forks_count','subscribers_count','open_issues_count','default_branch','pushed_at','archived','disabled','language','license','topics','size','created_at']}
                  out['repository_api_url']='https://api.github.com/repos/'+name
                  d=P/'repos'/name.replace('/','__');d.mkdir(parents=True,exist_ok=True)
                  commits=api('repos/'+name+'/commits?per_page=100')
                  head=commits[0];sha=head['sha'];out['head_sha']=sha;out['last_commit_at']=head['commit']['committer']['date'];out['commit_source_url']='https://github.com/'+name+'/commit/'+sha
                  out['commits_sample']=[{'sha':c['sha'],'date':c['commit']['committer']['date'],'author_login':(c.get('author') or {}).get('login'),'message':c['commit']['message'].splitlines()[0][:200]} for c in commits]
                  out['commits_since_2026_03_13_in_sample']=sum(c['commit']['committer']['date']>='2026-03-13T00:00:00Z' for c in commits)
                  out['history_sample_is_capped']=len(commits)==100
                  out['sampled_author_logins']=sorted(set((c.get('author') or {}).get('login') for c in commits if (c.get('author') or {}).get('login'))
                  for endpoint,filename,field in [('readme','README.source.txt','readme_receipt'),('license','LICENSE.source.txt','license_receipt')]:
                      try:
                          f=api('repos/'+name+'/'+endpoint+'?ref='+sha)
                          out[field]=decode_file(f,d/filename)
                          out[field]['pinned_url']='https://github.com/'+name+'/blob/'+sha+'/'+f['path']
                          if endpoint=='license':out['license_detection']=f.get('license')
                      except Exception as e:out['errors'].append({'resource':endpoint,'error':str(e)})
                  try:
                      listing=api('repos/'+name+'/contents?ref='+sha)
                      out['root_files']=[{'name':r['name'],'path':r['path'],'type':r['type'],'sha':r['sha']} for r in listing]
                      targets=[r for r in listing if r['type']=='file' and r['name'] in ('package.json','go.mod','Cargo.toml','pyproject.toml','Gemfile','docker-compose.yml','compose.yaml','docker-compose.yaml')][:3]
                      out['manifest_receipts']=[]
                      for f in targets:
                          try:
                              url='https://raw.githubusercontent.com/'+name+'/'+sha+'/'+urllib.parse.quote(f['path'])
                              body=get(url,True);(d/(f['name']+'.source.txt')).write_bytes(body)
                              out['manifest_receipts'].append({'path':f['path'],'source_url':url,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()})
                          except Exception as e:out['errors'].append({'resource':f['path'],'error':str(e)})
                  except Exception as e:out['errors'].append({'resource':'root','error':str(e)})
                  try:
                      issues=api('repos/'+name+'/issues?state=all&per_page=5')
                      out['issue_sample']=[{k:i.get(k) for k in ['number','title','state','created_at','updated_at','closed_at','comments','html_url','pull_request']} for i in issues]
                  except Exception as e:out['errors'].append({'resource':'issues','error':str(e)})
                  keys=[input_name.lower(),name.lower()]
                  out['bank_best_matches']=[bank_rows[k] for k in keys if k in bank_rows]
                  out['product_shelf_matches']=[shelf_rows[k] for k in keys if k in shelf_rows]
                  out['bank_status']='ALREADY IN THE BANK' if any(k in names for k in keys) else ('NEW' if membership_complete else 'UNVERIFIED')
                  out['bank_membership_scan_complete']=membership_complete
                  out['adoption_matches']=[adoption[k] for k in keys if k in adoption]
                  out['liftability_matches']=[liftability[k] for k in keys if k in liftability]
                  out['contract_cards']=[cards[k] for k in keys if k in cards]
                  out['evidence_scope']='source_snapshot_not_build_security_or_deployment_verification'
                  save(d/'receipt.json',out)
              except Exception as e:out['errors'].append({'resource':'repository_or_head','error':str(e)})
              return out
          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              for row in pool.map(inspect,selected):
                  results.append(row)
                  print('SOURCE_RECEIPT',row.get('full_name',row['input_name']),'head='+str(row.get('head_sha')),'errors='+str(len(row['errors'])))
          save(P/'repository-receipts.json',results)
          summary={'observed_at':NOW,'bank_pin':PIN,'bank_best_rows':len(bank_rows),'shelf_indexed_names':len(shelf_rows),'bank_membership_complete':membership_complete,'bank_seeded_name_count':len(names),'search_queries_succeeded':len(searchlog),'discovered_name_count':len(inventory),'selected_for_source_inspection':len(selected),'repository_heads_verified':sum(bool(r.get('head_sha')) for r in results),'readmes_retrieved':sum(bool(r.get('readme_receipt')) for r in results),'license_files_retrieved':sum(bool(r.get('license_receipt')) for r in results),'bank_already':sum(r.get('bank_status')=='ALREADY IN THE BANK' for r in results),'bank_new':sum(r.get('bank_status')=='NEW' for r in results),'errors':errors,'application_code_written':False,'upstream_code_executed':False,'production_deployment_performed':False,'saturation_universally_proven':False}
          save(P/'SUMMARY.json',summary)
          print(json.dumps(summary,indent=2))
          PY
      - name: Preserve source receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: saas-base-stack-public-source-receipts
          path: receipts/
          if-no-files-found: error
          retention-days: 3
