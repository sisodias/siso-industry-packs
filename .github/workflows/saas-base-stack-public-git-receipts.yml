name: SaaS public Git source receipts
on:
  push:
    branches: [research/saas-base-stack-20260913]
    paths: [.github/workflows/saas-base-stack-public-git-receipts.yml]
permissions: {}
jobs:
  public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Read public Git objects and repository pages
        env:
          PYTHONUNBUFFERED: '1'
          GIT_TERMINAL_PROMPT: '0'
        run: |
          python3 - <<'PY'
          import ast,concurrent.futures,datetime,hashlib,html,json,pathlib,re,shutil,subprocess,tempfile,textwrap,urllib.request
          P=pathlib.Path('git-receipts');P.mkdir()
          source='https://raw.githubusercontent.com/sisodias/siso-industry-packs/e9e428a722d926aa36edeb316e58fc1dfae5ee1d/.github/workflows/saas-base-stack-research-receipts.yml'
          with urllib.request.urlopen(source,timeout=30) as response: original=response.read().decode()
          source_code=textwrap.dedent(original.split("          python3 - <<'PY'\n",1)[1].split('\n          PY\n',1)[0])
          seeds=ast.literal_eval(re.search(r'seeds=(\{.*?\})\nqueries=',source_code,re.S).group(1).replace('.split()', ''))
          names={r:stage for stage,rs in seeds.items() for r in rs.split()}
          names.update({'formbricks/hub':'W07','awesome-selfhosted/awesome-selfhosted':'W10','awesome-foss/awesome-sysadmin':'W10','flexprice/flexprice':'W04','hexclave/hexclave':'W04'})
          selected={'chatwoot/chatwoot','formbricks/formbricks','n8n-io/n8n','TryGhost/Ghost','keycloak/keycloak','umami-software/umami','alextselegidis/easyappointments','vikunja/vikunja','stripe/stripe-node','restic/restic','caddyserver/caddy','formbricks/hub'}
          def save(path,data):
              path.parent.mkdir(parents=True,exist_ok=True);path.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          def request(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'siso-public-source-research'}),timeout=35) as r:return r.read(),r.url
          def run(cwd,*args):
              p=subprocess.run(['git','-c','core.hooksPath=/dev/null','-c','protocol.file.allow=never',*args],cwd=cwd,capture_output=True,timeout=100)
              if p.returncode:raise RuntimeError(p.stderr.decode(errors='replace')[-1200:])
              return p.stdout
          def inspect(item):
              name,stage=item;out={'input_name':name,'full_name':name,'stage':stage,'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source_mode':'public_git_objects_and_github_repository_page_via_connector_triggered_research_job','errors':[]}
              d=P/'repos'/name.replace('/','__');d.mkdir(parents=True,exist_ok=True)
              tmp=pathlib.Path(tempfile.mkdtemp())
              try:
                  page,finalurl=request('https://github.com/'+name)
                  (d/'repository-page.html').write_bytes(page)
                  text=page.decode(errors='replace');out['repository_url']=finalurl
                  out['repository_page_sha256']=hashlib.sha256(page).hexdigest()
                  out['archived_banner']='This repository was archived by the owner' in text
                  m=re.search(r'<span\b[^>]*\bid="repo-stars-counter-star"[^>]*>',text)
                  star=None
                  if m:
                      tag=m.group(0);t=re.search(r'\btitle="([0-9,]+)"',tag)
                      if t:star=int(t.group(1).replace(',',''))
                  if star is None:
                      m=re.search(r'([0-9,]+) users? starred this repository',text)
                      if m:star=int(m.group(1).replace(',',''))
                  out['stars']=star
                  desc=re.search(r'<meta\s+(?:[^>]*?)name="description"\s+content="([^"]*)"',text)
                  out['page_description']=html.unescape(desc.group(1)) if desc else None
                  print('PAGE',name,'stars',star,flush=True)
                  run(tmp,'clone','--depth=30','--filter=blob:none','--no-checkout','https://github.com/'+name+'.git','repo')
                  wd=tmp/'repo'
                  sha=run(wd,'rev-parse','HEAD').decode().strip();out['head_sha']=sha
                  log=run(wd,'log','-30','--format=%H%x09%cI%x09%an%x09%s').decode(errors='replace').splitlines()
                  out['commits_sample']=[dict(zip(['sha','date','author','message'],line.split('\t',3))) for line in log]
                  out['last_commit_at']=out['commits_sample'][0]['date'];out['commit_source_url']='https://github.com/'+name+'/commit/'+sha
                  roots=run(wd,'ls-tree','--name-only','HEAD').decode().splitlines();out['root_files']=roots
                  targets=[f for f in roots if f.lower().startswith(('readme','license','licence','copying','notice'))]
                  targets += [f for f in roots if f in ['package.json','go.mod','Cargo.toml','pyproject.toml','Gemfile','composer.json','docker-compose.yml','docker-compose.yaml','compose.yaml','compose.yml','Dockerfile']][:4]
                  if name in selected:
                      allfiles=run(wd,'ls-tree','-r','--name-only','HEAD').decode().splitlines()
                      out['all_license_paths']=[f for f in allfiles if f.rsplit('/',1)[-1].lower().startswith(('license','licence','copying'))]
                      targets += [f for f in out['all_license_paths'] if f not in targets][:12]
                  out['file_receipts']=[]
                  for path in targets:
                      try:
                          body=run(wd,'show','HEAD:'+path)
                          if len(body)>1000000:out['errors'].append({'path':path,'error':'source exceeds one-megabyte research limit'});continue
                          dest=d/'files'/path;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(body)
                          out['file_receipts'].append({'path':path,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest(),'git_blob_sha1':hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest(),'url':'https://github.com/'+name+'/blob/'+sha+'/'+path})
                      except Exception as error:out['errors'].append({'path':path,'error':str(error)})
                  out['readme_retrieved']=any(f['path'].lower().startswith('readme') for f in out['file_receipts'])
                  out['license_retrieved']=any(f['path'].split('/')[-1].lower().startswith(('license','licence','copying')) for f in out['file_receipts'])
                  print('PINNED_SOURCE',name,sha,len(out['file_receipts']),flush=True)
              except Exception as error:
                  out['errors'].append({'resource':'public_repository_snapshot','error':str(error)});print('SOURCE_ERROR',name,str(error)[:200],flush=True)
              finally:shutil.rmtree(tmp,ignore_errors=True)
              save(d/'receipt.json',out);return out
          rows=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              for r in pool.map(inspect,names.items()):
                  rows.append(r);save(P/'repository-receipts.json',rows)
          summary={'date':'2026-09-13','requested':len(names),'heads':sum(bool(r.get('head_sha')) for r in rows),'readmes':sum(bool(r.get('readme_retrieved')) for r in rows),'licenses':sum(bool(r.get('license_retrieved')) for r in rows),'exact_star_counts':sum(r.get('stars') is not None for r in rows),'upstream_code_executed':False,'application_code_written':False}
          save(P/'SUMMARY.json',summary);print(json.dumps(summary),flush=True)
          PY
      - name: Preserve inspected public sources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: saas-public-git-source-receipts
          path: git-receipts/
          if-no-files-found: error
          retention-days: 3
