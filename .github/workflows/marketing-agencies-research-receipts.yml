name: Marketing agency research receipts (one bounded run)
on:
  push:
    branches: [research/marketing-agencies-20260913]
    paths: [.github/workflows/marketing-agencies-research-receipts.yml]
permissions:
  contents: write
concurrency:
  group: marketing-agencies-research-20260913
  cancel-in-progress: false
jobs:
  collect-public-research:
    if: github.repository == 'sisodias/siso-industry-packs' && github.ref_name == 'research/marketing-agencies-20260913'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch pinned research collector and record public-source evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request
          url = 'https://raw.githubusercontent.com/sisodias/siso-industry-packs/8e35abe47830314d333a3a8a16cf2f8e347c2287/packs/marketing_social_media_agencies/research/collect_receipts.py'
          with urllib.request.urlopen(url, timeout=60) as response:
              source = response.read()
          exec(compile(source, 'collect_receipts.py', 'exec'), {'__name__': '__main__'})
          PY
