name: Restaurants public evidence audit
on:
  push:
    branches: [research/restaurants-20260913]
    paths: [packs/restaurants/evidence/audit-request.json]
permissions:
  contents: read
concurrency:
  group: restaurants-evidence-audit-20260913
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      REQUEST_REVISION: ${{ github.sha }}
    steps:
      - name: Collect public research evidence only
        shell: bash
        run: |
          python3 - <<'BOOT'
          import base64,json,os,pathlib,textwrap,urllib.request
          url='https://api.github.com/repos/sisodias/siso-industry-packs/contents/.github/workflows/restaurants-evidence-audit.yml?ref=f76e6d00d592cd4583ddc4ab0123aed6593711cb'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'siso-restaurants-public-research'})
          with urllib.request.urlopen(req,timeout=60) as r: obj=json.load(r)
          assert obj['sha']=='79031b7c7863b39a14a2ca97df15642a65401447'
          source=base64.b64decode(obj['content']).decode()
          code=textwrap.dedent(source.split("python3 - <<'PY'\n",1)[1].rsplit('          PY',1)[0])
          marker='for attempt in range(5):\n'; assert marker in code
          code=code.split(marker,1)[0]
          code=code.replace("with urllib.request.urlopen(req,timeout=70) as r:return json.load(r)","with urllib.request.urlopen(req,timeout=70) as r:return json.loads(r.read() or b'[]')")
          code=code.replace("return {'_error':e.code}","return {'_error':e.code,'message':e.read().decode('utf-8','replace')[:300],'path':path}")
          code=code.replace("    return {'_error':'retries'}","        except (json.JSONDecodeError,urllib.error.URLError,TimeoutError) as e:\n            if attempt<3:time.sleep(3);continue\n            return {'_error':type(e).__name__,'path':path}\n    return {'_error':'retries'}")
          code=code.replace("if not obj.get('content'):","if not isinstance(obj,dict) or not obj.get('content'):")
          code=code.replace("obj.get('_error','empty')","obj.get('_error','empty') if isinstance(obj,dict) else 'empty'")
          needle="        return out\n    with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:rows=list(pool.map(collect,enumerate(names,1)))"
          replacement="        output('source-'+str(number).zfill(3)+'.json',{'full_name':n,'revision':rev,'readme':out['readme'],'license_file':out['license_file']})\n        return out\n    def safe_collect(pair):\n        try:return collect(pair)\n        except Exception as e:return {'audit_id':'R'+str(pair[0]).zfill(3),'requested_full_name':pair[1],'observed_at':NOW,'retrieval_error':type(e).__name__+': '+str(e)[:180]}\n    with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:rows=list(pool.map(safe_collect,enumerate(names,1)))"
          assert needle in code
          code=code.replace(needle,replacement)
          code+="\nfrom pathlib import Path\nfor path,text in outputs.items():\n    dst=Path('artifact')/path\n    dst.parent.mkdir(parents=True,exist_ok=True)\n    dst.write_text(text)\nprint('Public research evidence files:',len(outputs),'mode:',cfg['mode'])\n"
          exec(compile(code,'pinned-restaurants-research-collector','exec'))
          BOOT
      - name: Preserve public sources for inspection; not a licence to redistribute
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: restaurants-public-evidence-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
