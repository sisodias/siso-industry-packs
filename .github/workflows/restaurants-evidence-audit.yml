name: Restaurants public evidence audit
on:
  push:
    branches: [research/restaurants-20260913]
    paths: [packs/restaurants/evidence/audit-request.json]
permissions:
  contents: write
concurrency:
  group: restaurants-evidence-audit-20260913
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      REQUEST_REVISION: ${{ github.sha }}
    steps:
      - name: Collect public research evidence only
        shell: bash
        run: |
          python3 - <<'BOOT'
          import base64,json,os,pathlib,textwrap,urllib.request
          url='https://api.github.com/repos/sisodias/siso-industry-packs/contents/.github/workflows/restaurants-evidence-audit.yml?ref=f76e6d00d592cd4583ddc4ab0123aed6593711cb'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'siso-restaurants-public-research'})
          with urllib.request.urlopen(req,timeout=60) as r: obj=json.load(r)
          assert obj['sha']=='79031b7c7863b39a14a2ca97df15642a65401447'
          source=base64.b64decode(obj['content']).decode()
          code=textwrap.dedent(source.split("python3 - <<'PY'\n",1)[1].rsplit('          PY',1)[0])
          marker='for attempt in range(5):\n'; assert marker in code
          code=code.split(marker,1)[0]
          code=code.replace("return {'_error':e.code}","return {'_error':e.code,'message':e.read().decode('utf-8','replace')[:400],'path':path}")
          code+="\nfrom pathlib import Path\nfor path,text in outputs.items():\n    dst=Path('artifact')/path\n    dst.parent.mkdir(parents=True,exist_ok=True)\n    dst.write_text(text)\nprint('Public research evidence files:',len(outputs),'mode:',cfg['mode'])\n"
          exec(compile(code,'pinned-restaurants-research-collector','exec'))
          # Public source excerpts stay in the inspection artifact. Persist compact
          # provenance, counts and metadata only, never unrelated client files.
          if cfg.get('publish',False):
              publish={}
              for path,text in outputs.items():
                  name=path.rsplit('/',1)[-1]
                  if name in ('candidate-index.jsonl','candidate-audit-receipt.json','bank-scan-receipt.json'):
                      publish[path]=text
                  elif re.fullmatch(r'search-round-\d+\.json',name):
                      obj=json.loads(text)
                      for q in obj['queries']:
                          for hit in q['results']:hit['description']=(hit.get('description') or '')[:300]
                      publish[path]=json.dumps(obj,ensure_ascii=False,indent=2)+'\n'
              if cfg['mode']=='candidates':
                  safe=[]
                  for row in rows:
                      row=dict(row)
                      for field in ('readme','license_file'):
                          row[field]={k:v for k,v in row.get(field,{}).items() if k not in ('text','excerpt','tail')}
                      safe.append(row)
                  publish[ROOT+'candidate-metadata.jsonl']=''.join(json.dumps(r,ensure_ascii=False)+'\n' for r in safe)
              for path,text in publish.items():
                  assert path.startswith(ROOT) and '..' not in path
                  prior=api('/repos/'+REPO+'/contents/'+path+'?ref='+urllib.parse.quote(BRANCH,safe=''))
                  if prior.get('_error') not in (None,404):raise RuntimeError('Contents read refused: '+str(prior))
                  payload={'message':'research(restaurants): preserve '+path.rsplit('/',1)[-1],'branch':BRANCH,'content':base64.b64encode(text.encode()).decode()}
                  if prior.get('sha'):payload['sha']=prior['sha']
                  req=urllib.request.Request(API+'/repos/'+REPO+'/contents/'+path,data=json.dumps(payload).encode(),method='PUT',headers={'Authorization':'Bearer '+TOKEN,'Accept':'application/vnd.github+json','User-Agent':'siso-restaurants-public-research'})
                  try:
                      with urllib.request.urlopen(req,timeout=90) as r:receipt=json.load(r)
                  except urllib.error.HTTPError as e:raise RuntimeError('Contents publication HTTP '+str(e.code)+': '+e.read().decode()[:300])
                  print('Published compact evidence',path,receipt['commit']['sha'])
          BOOT
      - name: Preserve immutable public evidence for connector review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: restaurants-public-evidence-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
