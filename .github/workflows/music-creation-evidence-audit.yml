name: Music creation public evidence audit
on:
  push:
    branches: [research/music-creation-20260913]
    paths: [packs/music_creation/evidence/audit-request.json]
permissions:
  contents: write
concurrency:
  group: music-creation-evidence-audit
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      REQUEST_REVISION: ${{ github.sha }}
    steps:
      - name: Collect public text only and publish bounded research receipts
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, concurrent.futures, datetime, hashlib, json, os, re, time, urllib.request, urllib.error, urllib.parse
          REPO='sisodias/siso-industry-packs'; BRANCH='research/music-creation-20260913'; ROOT='packs/music_creation/evidence/'; API='https://api.github.com'
          assert os.environ['GH_REPOSITORY']==REPO
          NOW=datetime.datetime.now(datetime.timezone.utc).isoformat(); TOKEN=os.environ['GH_TOKEN']; outputs={}
          def api(path,data=None,method=None):
              assert path.startswith('/') and not path.startswith('//')
              for attempt in range(4):
                  req=urllib.request.Request(API+path,data=None if data is None else json.dumps(data).encode(),method=method,headers={'Authorization':'Bearer '+TOKEN,'Accept':'application/vnd.github+json','User-Agent':'siso-music-public-research','X-GitHub-Api-Version':'2022-11-28'})
                  try:
                      with urllib.request.urlopen(req,timeout=90) as r:return json.load(r)
                  except urllib.error.HTTPError as e:
                      if e.code in (403,429,500,502,503,504) and attempt<3:time.sleep(6*(attempt+1));continue
                      return {'_error':e.code}
                  except Exception as e:return {'_error':type(e).__name__}
          def raw(repo,ref,path):
              url='https://raw.githubusercontent.com/'+repo+'/'+ref+'/'+urllib.parse.quote(path,safe='/')
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'siso-music-public-research'}),timeout=45) as r:
                      b=r.read(250000)
                  t=b.decode('utf-8','replace')
                  return {'path':path,'text':t,'characters':len(t),'sha256':hashlib.sha256(b).hexdigest(),'source_url':'https://github.com/'+repo+'/blob/'+ref+'/'+path,'truncated_at_bytes':250000 if len(b)==250000 else None}
              except Exception:return None
          def output(name,value):
              assert re.fullmatch(r'[A-Za-z0-9_.-]+',name)
              outputs[ROOT+name]=value if isinstance(value,str) else json.dumps(value,ensure_ascii=False,indent=2)+'\n'
          request=api('/repos/'+REPO+'/contents/'+ROOT+'audit-request.json?ref='+os.environ['REQUEST_REVISION'])
          cfg=json.loads(base64.b64decode(request['content']));assert cfg['mode'] in ('search','candidates','files')
          if cfg['mode']=='search':
              queries=cfg['queries']; assert 1<=len(queries)<=70
              known=set(n.lower() for n in cfg.get('previously_seen',[]));added=set();records=[]
              for q in queries:
                  assert 1<=q.get('per_page',10)<=30
                  path='/search/repositories?'+urllib.parse.urlencode({'q':q['query'],'sort':'stars','order':'desc','per_page':q.get('per_page',10),'page':q.get('page',1)})
                  data=api(path);items=data.get('items',[]);row={**q,'observed_at':NOW,'source_url':API+path,'total_count':data.get('total_count'),'incomplete_results':data.get('incomplete_results'),'error':data.get('_error'),'results':[],'new_names':[]}
                  for r in items:
                      n=r['full_name'];row['results'].append({k:r.get(k) for k in ('full_name','description','html_url','stargazers_count','archived','pushed_at','license','topics')})
                      if n.lower() not in known:known.add(n.lower());added.add(n);row['new_names'].append(n)
                  records.append(row);time.sleep(2.2)
              rnd=str(cfg['round']).zfill(2)
              output('search-round-'+rnd+'.json',{'round':cfg['round'],'observed_at':NOW,'queries':records,'unique_new_count':len(added),'new_names':sorted(added),'known_names':sorted(known),'scope':'Bounded pages sorted by stars; not exhaustive enumeration. Errors are not dry results.'})
              for start in range(0,len(records),6):
                  output('search-'+rnd+'-brief-'+str(start//6+1).zfill(2)+'.jsonl',''.join(json.dumps(r,ensure_ascii=False)+'\n' for r in records[start:start+6]))
          elif cfg['mode']=='files':
              records=[]
              for f in cfg['files']:
                  assert re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',f['repository'])
                  records.append({'repository':f['repository'],'revision':f['revision'],'requested_path':f['path'],'result':raw(f['repository'],f['revision'],f['path'])})
              output('extra-source-files.json',records)
          else:
              names=list(dict.fromkeys(cfg['repositories']));assert 100<=len(names)<=180
              assert all(re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',n) for n in names)
              bankrepo='sisodias/siso-repo-bank';bankhead=api('/repos/'+bankrepo+'/commits/main')['sha'];bank={};bank_receipts=[]
              paths=['bank/bank_capability_top.jsonl','bank/bank_capability.jsonl','capability-shelf/source-registry.jsonl','bank/bank_best.jsonl','bank/bank_adoption_v2.jsonl','bank/bank_liftable_ranked.jsonl','bank/bank_contractcard.jsonl']
              def fullname(row):
                  for k in ('full_name','repo_full_name','repository_full_name','repository','repo','name','url','repo_url','repository_url','source_url'):
                      v=row.get(k)
                      if isinstance(v,str):
                          v=v.removeprefix('https://github.com/').removesuffix('.git').strip('/')
                          if re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',v):return v.lower()
                  return None
              for path in paths:
                  url='https://raw.githubusercontent.com/'+bankrepo+'/'+bankhead+'/'+path;idx={};h=hashlib.sha256();count=0
                  with urllib.request.urlopen(url,timeout=120) as r:
                      for b in r:
                          h.update(b)
                          if not b.strip():continue
                          row=json.loads(b);count+=1;n=fullname(row)
                          if n:idx.setdefault(n,[]).append(row)
                  bank[path]=idx;bank_receipts.append({'path':path,'rows':count,'sha256':h.hexdigest(),'source_url':'https://github.com/'+bankrepo+'/blob/'+bankhead+'/'+path})
              def collect(pair):
                  number,name=pair;out={'audit_id':'R'+str(number).zfill(3),'requested_full_name':name,'observed_at':NOW,'bank_revision':bankhead};m=api('/repos/'+name)
                  if '_error' in m:return out|{'retrieval_error':m['_error']}
                  n=m['full_name'];base='/repos/'+n
                  out.update({k:m.get(k) for k in ('full_name','html_url','description','stargazers_count','forks_count','default_branch','archived','disabled','created_at','updated_at','pushed_at','size','open_issues_count','topics','license')})
                  cs=api(base+'/commits?per_page=100');rev=cs[0]['sha'] if isinstance(cs,list) and cs else None
                  out['revision']=rev;out['last_commit']=cs[0]['commit']['committer']['date'] if rev else None
                  out['sources']={'repository':API+base,'commits':API+base+'/commits?per_page=100','commit':cs[0]['html_url'] if rev else None}
                  recent=[c for c in cs if c['commit']['committer']['date']>='2026-03-13T00:00:00Z'] if isinstance(cs,list) else None
                  out['commits_six_months_sample_count']=len(recent) if recent is not None else None;out['commits_six_months_capped']=isinstance(cs,list) and len(cs)==100 and len(recent)==100
                  out['distinct_authors_in_recent_commit_sample']=len(set(c['commit']['author'].get('name','') for c in recent)) if recent is not None else None
                  out['bus_factor']='unmeasured; distinct commit authors are not maintainership redundancy'
                  readme=None;license_file=None
                  if rev:
                      for p in ['README.md','README.rst','README','Readme.md','readme.md','README.txt','README.markdown']:
                          readme=raw(n,rev,p)
                          if readme:break
                      for p in ['LICENSE','COPYING','LICENSE.txt','LICENSE.md','COPYING.txt','COPYING.md','LICENSE.rst','LICENSE-MIT','LICENSE-MIT.txt','License.txt','License.md','LICENCE','LICENSES/README.md']:
                          license_file=raw(n,rev,p)
                          if license_file:break
                  out['readme']=readme or {'error':'not_found_in_common_root_paths'};out['license_file']=license_file or {'error':'not_found_in_common_root_paths; absence not proven'}
                  if not license_file:
                      listing=api(base+'/contents?ref='+str(rev));out['root_files']=[x['name'] for x in listing] if isinstance(listing,list) else listing
                  aliases={name.lower(),n.lower()};out['bank_rows']={p:[r for a in aliases for r in idx.get(a,[])] for p,idx in bank.items() if p!='bank/bank_capability.jsonl'}
                  out['bank_membership_layers']=[p for p,rows in out['bank_rows'].items() if rows];out['bank_status']='ALREADY IN THE BANK' if out['bank_membership_layers'] else 'NEW';out['adoption_evidence']=out['bank_rows'].get('bank/bank_adoption_v2.jsonl',[])
                  out['dependency_leads']=sorted(set(re.findall(r'https?://github.com/([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)',out['readme'].get('text',''))))
                  if name in cfg.get('issue_sample_repositories',[]):
                      issues=api(base+'/issues?state=all&sort=updated&direction=desc&per_page=10')
                      out['issues_sample']=[{k:i.get(k) for k in ('number','title','state','created_at','updated_at','closed_at','comments','html_url','author_association')} for i in issues if 'pull_request' not in i][:3] if isinstance(issues,list) else None
                      out['issue_response_sample']=[]
                      for issue in (out.get('issues_sample') or [])[:1]:
                          if issue['comments']:
                              comments=api(base+'/issues/'+str(issue['number'])+'/comments?per_page=20')
                              if isinstance(comments,list):
                                  owned=[c for c in comments if c.get('author_association') in ('OWNER','MEMBER','COLLABORATOR')]
                                  if owned:out['issue_response_sample'].append({'issue':issue['number'],'created_at':issue['created_at'],'first_affiliated_reply_in_sample':owned[0]['created_at'],'source_url':owned[0]['html_url']})
                  return out
              with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:rows=list(pool.map(collect,enumerate(names,1)))
              smalls=[]
              for i,r in enumerate(rows,1):
                  output('repo-'+str(i).zfill(3)+'.json',r)
                  keys=['audit_id','full_name','requested_full_name','description','stargazers_count','archived','last_commit','revision','license','commits_six_months_sample_count','commits_six_months_capped','distinct_authors_in_recent_commit_sample','bank_status','bank_membership_layers','adoption_evidence','retrieval_error','issues_sample','issue_response_sample','dependency_leads','root_files']
                  s={k:r.get(k) for k in keys};rd=r.get('readme',{});lc=r.get('license_file',{});s.update({'readme_excerpt':rd.get('text','')[:2400],'readme_source':rd.get('source_url'),'license_excerpt':lc.get('text','')[:1200],'license_source':lc.get('source_url'),'license_error':lc.get('error')});smalls.append(s)
              for start in range(0,len(smalls),4):output('review-'+str(start//4+1).zfill(2)+'.jsonl',''.join(json.dumps(x,ensure_ascii=False)+'\n' for x in smalls[start:start+4]))
              output('candidate-audit-receipt.json',{'observed_at':NOW,'requested':len(names),'repositories_retrieved':sum(bool(r.get('full_name')) for r in rows),'readmes_retrieved':sum(bool(r.get('readme',{}).get('text')) for r in rows),'license_files_retrieved':sum(bool(r.get('license_file',{}).get('text')) for r in rows),'current_commit_retrieved':sum(bool(r.get('revision')) for r in rows),'already_in_bank':sum(r.get('bank_status')=='ALREADY IN THE BANK' for r in rows),'new':sum(r.get('bank_status')=='NEW' for r in rows),'bank_revision':bankhead,'bank_files':bank_receipts,'membership_definition':'Case-insensitive canonical/redirected name in any of six repository-indexed bank layers, including discovery-only shelf rows; not solely bank_best.','upstream_execution':'None: public metadata, README, licence and issue text only; no application built or deployed.'})
          for attempt in range(5):
              ref=api('/repos/'+REPO+'/git/ref/heads/'+BRANCH);parent=ref['object']['sha'];commit=api('/repos/'+REPO+'/git/commits/'+parent)
              assert all(p.startswith(ROOT) for p in outputs)
              elements=[{'path':p,'mode':'100644','type':'blob','content':t} for p,t in outputs.items()]
              tree=api('/repos/'+REPO+'/git/trees',{'base_tree':commit['tree']['sha'],'tree':elements},'POST')
              if '_error' in tree:raise RuntimeError('evidence tree write failed '+str(tree['_error']))
              c=api('/repos/'+REPO+'/git/commits',{'message':'research(music_creation): public '+cfg['mode']+' receipts','tree':tree['sha'],'parents':[parent]},'POST')
              result=api('/repos/'+REPO+'/git/refs/heads/'+BRANCH,{'sha':c['sha'],'force':False},'PATCH')
              if '_error' not in result:print('Published',len(outputs),'public evidence files; commit',c['sha']);break
              if result['_error'] not in (409,422):raise RuntimeError('ref update failed '+str(result['_error']))
          else:raise RuntimeError('concurrent branch update prevented publication')
          print('No upstream code executed. No application built or deployed.')
          PY
