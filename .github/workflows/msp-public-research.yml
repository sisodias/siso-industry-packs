name: MSP public frontier evidence
on:
  push:
    branches: [research/it-services-msps-20260913]
    paths: [.github/workflows/msp-public-research.yml]
permissions:
  contents: read
  actions: read
jobs:
  public-frontier-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Retrieve and run only our public research collector
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/sisodias/siso-industry-packs/005b3227d0ee254a6a6856d6db60a2585be13006/research-tools/msps_frontier_review.py --output /tmp/msps_frontier_review.py
          python3 - <<'PY'
          import runpy, urllib.request, urllib.parse
          class PublicStorageRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  next_req = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if next_req and urllib.parse.urlsplit(req.full_url).netloc != urllib.parse.urlsplit(newurl).netloc:
                      next_req.remove_header('Authorization')
                  return next_req
          urllib.request.install_opener(urllib.request.build_opener(PublicStorageRedirect()))
          runpy.run_path('/tmp/msps_frontier_review.py', run_name='__main__')
          PY
      - name: Preserve public source dossiers and review receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: msp-frontier-evidence-20260913
          path: evidence/repo-sweep/
          retention-days: 2
          if-no-files-found: error
