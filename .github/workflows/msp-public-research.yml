name: MSP public repository evidence
on:
  push:
    branches: [research/it-services-msps-20260913]
    paths: [.github/workflows/msp-public-research.yml]
permissions:
  contents: read
jobs:
  public-repository-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Retrieve and run only our public research collector
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/sisodias/siso-industry-packs/1f77eea1da30703d68820c7430455a176d82f4b2/research-tools/msps_public_sweep.py --output /tmp/msps_public_sweep.py
          python3 /tmp/msps_public_sweep.py
      - name: Preserve public metadata and source-file evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: msp-repository-evidence-20260913
          path: evidence/repo-sweep/
          retention-days: 2
          if-no-files-found: error
