name: Events research evidence export
on:
  push:
    branches: [research/events-management-20260913]
    paths: [.github/workflows/events-research-export.yml]
permissions:
  contents: read
jobs:
  public-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Diagnose read access; print no tokens or private data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, urllib.error
          out=pathlib.Path('evidence-export');out.mkdir()
          results=[]
          for auth,path in [(True,'rate_limit'),(True,'repos/HiEventsDev/Hi.Events'),(False,'repos/HiEventsDev/Hi.Events')]:
              headers={'User-Agent':'SISO-public-evidence-diagnostic','Accept':'application/vnd.github+json'}
              if auth: headers['Authorization']='Bearer '+os.environ['GH_TOKEN']
              req=urllib.request.Request('https://api.github.com/'+path,headers=headers)
              try:
                  r=urllib.request.urlopen(req,timeout=20)
              except urllib.error.HTTPError as e: r=e
              data=json.loads(r.read())
              result={'auth':auth,'path':path,'status':r.status,'message':data.get('message'),'documentation_url':data.get('documentation_url'),'resources':data.get('resources'),'full_name':data.get('full_name'),'rate_remaining':r.headers.get('x-ratelimit-remaining'),'rate_reset':r.headers.get('x-ratelimit-reset'),'rate_resource':r.headers.get('x-ratelimit-resource'),'retry_after':r.headers.get('retry-after')}
              results.append(result); print(json.dumps(result))
          (out/'diagnostic.json').write_text(json.dumps(results,indent=2))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: events-access-diagnostic
          path: evidence-export/
          retention-days: 7
