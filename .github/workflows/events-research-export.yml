name: Events research evidence export
on:
  push:
    branches: [research/events-management-20260913]
    paths: [.github/workflows/events-research-export.yml]
permissions:
  contents: read
jobs:
  public-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Re-run pinned research collector with bounded pacing; no candidate code execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PATCH'
          import urllib.request, textwrap
          url='https://raw.githubusercontent.com/sisodias/siso-industry-packs/8fcd24ea4a65dcc964f538f636a3e91b2e6e9a6f/.github/workflows/events-research-export.yml'
          source=urllib.request.urlopen(url,timeout=30).read().decode()
          code=source.split("python3 - <<'PY'\n",1)[1].split('\n          PY',1)[0]
          code=textwrap.dedent(code)
          start=code.index('requests = 0\n')
          end=code.index('queries = [',start)
          replacement='''import threading, urllib.error
          requests = 0
          lock=threading.Lock()
          next_request=0.0
          def get(path):
              global requests,next_request
              u='https://api.github.com/'+path.lstrip('/')
              for attempt in range(3):
                  with lock:
                      time.sleep(max(0,next_request-time.monotonic()))
                      next_request=time.monotonic()+0.65
                      requests+=1
                      if requests>1100: raise RuntimeError('API request cap reached')
                  req=urllib.request.Request(u,headers={'User-Agent':'SISO-public-evidence-diagnostic','Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN']})
                  try:
                      with urllib.request.urlopen(req,timeout=30) as r: return json.loads(r.read(5000000))
                  except urllib.error.HTTPError as e:
                      try: detail=json.loads(e.read()).get('message','')
                      except Exception: detail='HTTP failure'
                      error={'_error':str(e.code)+': '+detail,'_url':u}
                      if e.code in (403,429) and attempt<2:
                          delay=min(90,max(60,int(e.headers.get('Retry-After','60'))))
                          print('READ_BACKOFF',e.code,detail[:160],delay,flush=True)
                          time.sleep(delay)
                      else: return error
                  except Exception as e: return {'_error':type(e).__name__+': '+str(e),'_url':u}
              return error
          '''
          code=code[:start]+textwrap.dedent(replacement)+code[end:]
          code=code.replace("'getontime/ontime'","'cpvalente/ontime'").replace("'org:getontime'","'user:cpvalente'")
          code=code.replace('time.sleep(2.2)','time.sleep(4.2)').replace('selected=selected[:165]','selected=selected[:130]').replace('max_workers=3','max_workers=2')
          exec(compile(code,'pinned-public-research-collector','exec'),{'__name__':'__main__'})
          PATCH
      - name: Upload bounded evidence including any partial failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: events-oss-evidence-paced
          path: evidence-export/
          retention-days: 7
