name: Accounting firms public evidence audit
on:
  push:
    branches: [research/accounting-firms-20260913]
    paths: [packs/accounting_firms/evidence/audit-request.json]
permissions:
  contents: write
concurrency:
  group: accounting-firms-public-research
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      REQUEST_REVISION: ${{ github.sha }}
    steps:
      - name: Read public bank and upstream text; never execute upstream code
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, concurrent.futures, datetime, hashlib, json, os, pathlib, re, time, urllib.request, urllib.error, urllib.parse
          REPO='sisodias/siso-industry-packs'
          BRANCH='research/accounting-firms-20260913'
          ROOT='packs/accounting_firms/evidence/'
          assert os.environ['GH_REPOSITORY']==REPO
          API='https://api.github.com'; TOKEN=os.environ['GH_TOKEN']
          NOW=datetime.datetime.now(datetime.timezone.utc).isoformat()
          OUT=pathlib.Path('research-evidence'); OUT.mkdir(exist_ok=True)
          def api(path,data=None,method=None):
              assert path.startswith('/') and not path.startswith('//')
              if data is not None: assert path.startswith('/repos/'+REPO+'/git/')
              for attempt in range(5):
                  req=urllib.request.Request(API+path,data=None if data is None else json.dumps(data).encode(),method=method,headers={'Authorization':'Bearer '+TOKEN,'Accept':'application/vnd.github+json','User-Agent':'siso-accounting-public-research','X-GitHub-Api-Version':'2022-11-28'})
                  try:
                      with urllib.request.urlopen(req,timeout=90) as r: return json.load(r)
                  except urllib.error.HTTPError as e:
                      if e.code in (403,429,500,502,503,504) and attempt<4:
                          time.sleep(4*(attempt+1)); continue
                      return {'_error':e.code}
              return {'_error':'retries_exhausted'}
          def raw(repo,revision,path):
              assert re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',repo)
              url='https://raw.githubusercontent.com/'+repo+'/'+revision+'/'+urllib.parse.quote(path,safe='/')
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'siso-accounting-public-research'}),timeout=120) as r: return r.read()
              except (urllib.error.HTTPError,urllib.error.URLError): return None
          def textfile(name,value):
              assert re.fullmatch(r'[A-Za-z0-9_.-]+',name)
              text=value if isinstance(value,str) else json.dumps(value,ensure_ascii=False,indent=2)+'\n'
              (OUT/name).write_text(text)
              return text
          def publish_batch(values):
              entries=[]
              for name,val in values.items():
                  text=textfile(name,val)
                  entries.append({'path':ROOT+name,'mode':'100644','type':'blob','content':text})
              ref=api('/repos/'+REPO+'/git/ref/heads/'+BRANCH)
              parent=ref['object']['sha']; c=api('/repos/'+REPO+'/git/commits/'+parent)
              tree=api('/repos/'+REPO+'/git/trees',{'base_tree':c['tree']['sha'],'tree':entries},'POST')
              if 'sha' not in tree: raise RuntimeError('tree creation failed '+str(tree))
              commit=api('/repos/'+REPO+'/git/commits',{'message':'research(accounting_firms): record public evidence receipts','tree':tree['sha'],'parents':[parent]},'POST')
              if 'sha' not in commit: raise RuntimeError('commit creation failed '+str(commit))
              moved=api('/repos/'+REPO+'/git/refs/heads/'+BRANCH,{'sha':commit['sha'],'force':False},'PATCH')
              if '_error' in moved: raise RuntimeError('branch advanced concurrently; evidence retained as artifact')
              print('Published',len(values),'evidence files to research branch at',commit['sha'])
          request=api('/repos/'+REPO+'/contents/'+ROOT+'audit-request.json?ref='+os.environ['REQUEST_REVISION'])
          cfg=json.loads(base64.b64decode(request['content']))
          assert cfg['mode'] in ('bank','candidates')
          bankrepo='sisodias/siso-repo-bank'
          head=api('/repos/'+bankrepo+'/commits/main')['sha']
          paths=['bank/bank_capability_top.jsonl','bank/bank_capability.jsonl','capability-shelf/source-registry.jsonl','bank/bank_best.jsonl','bank/bank_adoption_v2.jsonl','bank/bank_liftable_ranked.jsonl','bank/bank_contractcard.jsonl','bank/category.jsonl']
          bank={};receipt={'observed_at':NOW,'bank_repository':bankrepo,'bank_revision':head,'mode':cfg['mode'],'source_access':'GitHub public REST/raw, collected by GitHub workflow and read through GitHub connector','files':[],'upstream_execution':'none; no installation, application build, client data or client credentials'}
          for path in paths:
              b=raw(bankrepo,head,path)
              if b is None: raise RuntimeError('required bank retrieval failed: '+path)
              rows=[json.loads(x) for x in b.splitlines() if x.strip()]
              bank[path]=rows
              receipt['files'].append({'path':path,'rows':len(rows),'sha256':hashlib.sha256(b).hexdigest(),'source_url':'https://github.com/'+bankrepo+'/blob/'+head+'/'+path})
          def fullname(row):
              for key in ('full_name','repo_full_name','repository_full_name','repository','repo','name'):
                  v=row.get(key)
                  if isinstance(v,str):
                      v=v.removeprefix('https://github.com/').removesuffix('.git').strip('/')
                      if re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',v):return v.lower()
              for key in ('url','repo_url','repository_url','source_url'):
                  m=re.search(r'github\.com/([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)',str(row.get(key,'')))
                  if m:return m.group(1).removesuffix('.git').lower()
              return None
          if cfg['mode']=='bank':
              pattern=re.compile(r'accounting|bookkeep|invoic|ledger|reconcil|payroll|ofx|xbrl|camt|iso.?20022|nacha|tax.calcul|tax.prepar|tax.fil|quickbooks|xero|chatwoot|freescout|paperless|papermerge|docspell|mayan|documenso|docuseal|docassemble|ocrmypdf|pdfplumber|kimai|solidtime',re.I)
              values={}
              for path,label,limit in [('capability-shelf/source-registry.jsonl','bank-shelf',250),('bank/bank_best.jsonl','bank-best',300),('bank/bank_contractcard.jsonl','bank-contracts',70)]:
                  matches=[r for r in bank[path] if pattern.search(json.dumps(r))]
                  receipt.setdefault('filtered',[]).append({'source':path,'matched':len(matches),'returned':min(limit,len(matches)),'filter':pattern.pattern,'truncated':len(matches)>limit})
                  for start in range(0,min(limit,len(matches)),15):
                      values[label+'-'+str(start//15+1).zfill(2)+'.jsonl']=''.join(json.dumps(r,ensure_ascii=False)+'\n' for r in matches[start:start+15])
              values['bank-receipt.json']=receipt
              values['capability-tags.json']=[r['capability'] for r in bank['bank/bank_capability.jsonl']]
              publish_batch(values)
          else:
              names=list(dict.fromkeys(cfg['repositories']))
              assert 1<=len(names)<=180 and all(re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',n) for n in names)
              indexes={p:{} for p in paths}
              for path,rows in bank.items():
                  for row in rows:
                      name=fullname(row)
                      if name:indexes[path].setdefault(name,[]).append(row)
              def collect(name):
                  out={'requested_full_name':name,'observed_at':NOW,'sources':{},'bank_revision':head}
                  meta=api('/repos/'+name)
                  if '_error' in meta:out['retrieval_error']=meta['_error'];return out
                  assert not meta.get('private'), 'public repositories only'
                  canonical=meta['full_name'];base='/repos/'+canonical
                  out.update({k:meta.get(k) for k in ('full_name','html_url','description','stargazers_count','forks_count','default_branch','archived','disabled','created_at','updated_at','pushed_at','size','open_issues_count','topics','license')})
                  out['sources']['repository']=API+base
                  commits=api(base+'/commits?per_page=1')
                  rev=commits[0]['sha'] if isinstance(commits,list) and commits else None
                  out['revision']=rev;out['last_commit']=commits[0]['commit']['committer']['date'] if rev else None
                  out['sources']['commit']=commits[0]['html_url'] if rev else None
                  readme=api(base+'/readme'+('?ref='+rev if rev else ''))
                  if readme.get('content'):
                      b=base64.b64decode(readme['content']);txt=b.decode('utf-8','replace')
                      out['readme']={'path':readme['path'],'sha256':hashlib.sha256(b).hexdigest(),'characters':len(txt),'excerpt':txt[:16000],'excerpt_truncated':len(txt)>16000,'source_url':'https://github.com/'+canonical+'/blob/'+str(rev)+'/'+readme['path']}
                  else:out['readme']={'error':readme.get('_error','empty')}
                  lic=api(base+'/license'+('?ref='+rev if rev else ''))
                  if lic.get('content'):
                      b=base64.b64decode(lic['content']);txt=b.decode('utf-8','replace')
                      out['license_file']={'path':lic['path'],'sha256':hashlib.sha256(b).hexdigest(),'detected':lic.get('license'),'text':txt,'source_url':'https://github.com/'+canonical+'/blob/'+str(rev)+'/'+lic['path']}
                  else:out['license_file']={'error':lic.get('_error','empty'),'status':'root license endpoint did not provide text; manual fallback required; no rights inferred'}
                  recent=api(base+'/commits?since=2026-03-13T00:00:00Z&per_page=100')
                  out['commits_six_months_sample_count']=len(recent) if isinstance(recent,list) else None
                  out['commits_six_months_capped']=isinstance(recent,list) and len(recent)==100
                  contrib=api(base+'/contributors?per_page=10')
                  out['contributors_top10']=[{'login':c.get('login'),'contributions':c.get('contributions')} for c in contrib] if isinstance(contrib,list) else None
                  out['bus_factor']='unmeasured; contributors are not independent maintainers'
                  issues=api(base+'/issues?state=all&sort=updated&direction=desc&per_page=10')
                  out['issues_sample']=[{k:i.get(k) for k in ('number','title','state','created_at','updated_at','closed_at','comments','html_url','author_association')} for i in issues if 'pull_request' not in i][:2] if isinstance(issues,list) else None
                  replies=[]
                  for issue in out.get('issues_sample') or []:
                      if issue['comments']:
                          comments=api(base+'/issues/'+str(issue['number'])+'/comments?per_page=20')
                          if isinstance(comments,list):
                              eligible=[c for c in comments if c.get('author_association') in ('OWNER','MEMBER','COLLABORATOR')]
                              if eligible:replies.append({'issue':issue['number'],'created_at':issue['created_at'],'first_affiliated_reply_in_sample':eligible[0]['created_at'],'source_url':eligible[0]['html_url']})
                  out['issue_response_sample']=replies
                  aliases={name.lower(),canonical.lower()}
                  out['bank_rows']={p:[r for alias in aliases for r in indexes[p].get(alias,[])] for p in paths if p not in ('bank/bank_capability.jsonl','bank/category.jsonl')}
                  out['bank_status']='ALREADY IN THE BANK' if any(out['bank_rows'].values()) else 'NEW'
                  out['bank_membership_definition']='exact canonical/requested name match across top, shelf, best, adoption, liftable and contract layers; not the unpublished identity database'
                  root=api(base+'/contents'+('?ref='+rev if rev else ''))
                  manifests={}
                  if isinstance(root,list):
                      for item in root:
                          if item.get('name') in ('pyproject.toml','requirements.txt','package.json','composer.json','go.mod','Cargo.toml'):
                              data=raw(canonical,rev,item['path']) if rev else None
                              if data:
                                  txt=data.decode('utf-8','replace')
                                  manifests[item['path']]={'sha256':hashlib.sha256(data).hexdigest(),'text':txt[:12000],'truncated':len(txt)>12000,'source_url':'https://github.com/'+canonical+'/blob/'+str(rev)+'/'+item['path']}
                              if len(manifests)>=2:break
                  out['dependency_manifests']=manifests
                  return out
              with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:rows=list(pool.map(collect,names))
              values={}
              for i,row in enumerate(rows,1):values['repo-'+str(i).zfill(3)+'.json']=row
              small=[]
              for r in rows:
                  obj={k:v for k,v in r.items() if k not in ('readme','license_file','bank_rows','contributors_top10','issues_sample','issue_response_sample','dependency_manifests')}
                  obj.update({'license_path':r.get('license_file',{}).get('path'),'license_sha256':r.get('license_file',{}).get('sha256'),'readme_path':r.get('readme',{}).get('path'),'bank_layers_present':[p for p,v in r.get('bank_rows',{}).items() if v],'bank_adoption':r.get('bank_rows',{}).get('bank/bank_adoption_v2.jsonl',[])})
                  small.append(obj)
              for start in range(0,len(small),10):values['candidates-'+str(start//10+1).zfill(2)+'.json']=small[start:start+10]
              receipt.update({'requested':len(names),'repositories_retrieved':sum(bool(r.get('full_name')) for r in rows),'readmes_retrieved':sum(bool(r.get('readme',{}).get('excerpt')) for r in rows),'license_files_retrieved':sum(bool(r.get('license_file',{}).get('text')) for r in rows),'current_commits_retrieved':sum(bool(r.get('revision')) for r in rows),'counts_are_retrieval_not_analyst_admission':True})
              values['candidate-audit-receipt.json']=receipt
              publish_batch(values)
          print('Completed public evidence collection; no application code built or upstream code executed.')
          PY
      - name: Preserve research evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accounting-firms-public-evidence
          path: research-evidence/
          retention-days: 30
          if-no-files-found: warn
