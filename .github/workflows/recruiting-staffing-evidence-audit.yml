name: Recruiting staffing public evidence audit
on:
  push:
    branches: [main]
    paths: [packs/recruiting_staffing/evidence/audit-request.json]
permissions:
  contents: write
concurrency:
  group: recruiting-staffing-evidence-audit
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      REQUEST_REVISION: ${{ github.sha }}
    steps:
      - name: Collect public metadata and text without executing upstream code
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, concurrent.futures, datetime, hashlib, json, os, re, time, urllib.request, urllib.error, urllib.parse
          REPO='sisodias/siso-industry-packs'; API='https://api.github.com'; ROOT='packs/recruiting_staffing/evidence/'
          assert os.environ['GH_REPOSITORY']==REPO
          NOW=datetime.datetime.now(datetime.timezone.utc).isoformat(); TOKEN=os.environ['GH_TOKEN']; outputs={}
          def api(path,data=None,method=None):
              assert path.startswith('/') and not path.startswith('//')
              for attempt in range(4):
                  request=urllib.request.Request(API+path,data=None if data is None else json.dumps(data).encode(),method=method,headers={'Authorization':'Bearer '+TOKEN,'Accept':'application/vnd.github+json','User-Agent':'siso-recruiting-public-research','X-GitHub-Api-Version':'2022-11-28'})
                  try:
                      with urllib.request.urlopen(request,timeout=90) as r:return json.load(r)
                  except urllib.error.HTTPError as e:
                      if e.code in (429,500,502,503,504) and attempt<3:time.sleep(5*(attempt+1));continue
                      return {'_error':e.code}
              return {'_error':'retries'}
          def raw(repo,ref,path):
              url='https://raw.githubusercontent.com/'+repo+'/'+ref+'/'+urllib.parse.quote(path,safe='/')
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'siso-recruiting-public-research'}),timeout=90) as r:return r.read()
              except urllib.error.HTTPError:return None
          def output(name,value):
              assert re.fullmatch(r'[A-Za-z0-9_.-]+',name)
              outputs[ROOT+name]=value if isinstance(value,str) else json.dumps(value,ensure_ascii=False,indent=2)+'\n'
          request=api('/repos/'+REPO+'/contents/'+ROOT+'audit-request.json?ref='+os.environ['REQUEST_REVISION'])
          cfg=json.loads(base64.b64decode(request['content'])); assert cfg['mode'] in ('bank','search','candidates')
          if cfg['mode']=='search':
              queries=cfg['queries']; assert 1<=len(queries)<=60
              known=set(x.lower() for x in cfg.get('previously_seen',[])); added=set(); records=[]
              for q in queries:
                  assert 1<=q.get('per_page',8)<=30
                  path='/search/repositories?'+urllib.parse.urlencode({'q':q['query'],'sort':'stars','order':'desc','per_page':q.get('per_page',8),'page':q.get('page',1)})
                  result=api(path); row={**q,'observed_at':NOW,'source_url':API+path,'total_count':result.get('total_count'),'incomplete_results':result.get('incomplete_results'),'error':result.get('_error'),'hits':[],'new_names':[]}
                  for r in result.get('items',[]):
                      n=r['full_name'];row['hits'].append({k:r.get(k) for k in ('full_name','description','html_url','stargazers_count','archived','pushed_at','license','topics')})
                      if n.lower() not in known:known.add(n.lower());added.add(n);row['new_names'].append(n)
                  records.append(row);time.sleep(2.2)
              rnd=str(cfg['round']).zfill(2)
              output('search-round-'+rnd+'.json',{'round':cfg['round'],'observed_at':NOW,'queries':records,'unique_new_count':len(added),'new_names':sorted(added),'scope':'Bounded query/page discovery, not exhaustive enumeration of GitHub.'})
              output('search-round-'+rnd+'-brief.jsonl',''.join(json.dumps({k:v for k,v in r.items() if k!='hits'}|{'hits':[(x['full_name'],x['stargazers_count'],x['description']) for x in r['hits']]},ensure_ascii=False)+'\n' for r in records))
          else:
              bankrepo='sisodias/siso-repo-bank';head=api('/repos/'+bankrepo+'/commits/main')['sha']
              files=['bank/bank_capability_top.jsonl','bank/bank_capability.jsonl','capability-shelf/source-registry.jsonl','bank/bank_best.jsonl','bank/bank_adoption_v2.jsonl','bank/bank_liftable_ranked.jsonl','bank/bank_contractcard.jsonl']
              names=list(dict.fromkeys(cfg.get('repositories',[]))); wanted=set(n.lower() for n in names); bank={}; receipt={'observed_at':NOW,'bank_repository':bankrepo,'bank_revision':head,'files':[],'upstream_execution':'none; metadata and public text retrieval only'}
              pattern=re.compile(cfg.get('filter','recruit|staffing|applicant|resume|timesheet|payroll|hrms|chatwoot|freescout|signature|scheduling|human resource'),re.I)
              def fullname(row):
                  for key in ('full_name','repo_full_name','repository_full_name','repository','repo','name','url','repo_url','repository_url','source_url'):
                      v=row.get(key)
                      if isinstance(v,str):
                          v=v.removeprefix('https://github.com/').removesuffix('.git').strip('/')
                          if re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',v):return v.lower()
                  return None
              for path in files:
                  url='https://raw.githubusercontent.com/'+bankrepo+'/'+head+'/'+path; count=0; digest=hashlib.sha256(); idx={}; matched=[]
                  with urllib.request.urlopen(url,timeout=90) as stream:
                      for line in stream:
                          digest.update(line)
                          if not line.strip():continue
                          row=json.loads(line);count+=1;n=fullname(row)
                          if n:idx.setdefault(n,[]).append(row)
                          if cfg['mode']=='bank' and path in ('capability-shelf/source-registry.jsonl','bank/bank_best.jsonl','bank/bank_contractcard.jsonl') and pattern.search(json.dumps(row)):matched.append(row)
                  bank[path]=idx;receipt['files'].append({'path':path,'rows':count,'sha256':digest.hexdigest(),'source_url':'https://github.com/'+bankrepo+'/blob/'+head+'/'+path})
                  if cfg['mode']=='bank' and matched:
                      tag=path.split('/')[-1].replace('.jsonl','');output('bank-'+tag+'-matches.jsonl',''.join(json.dumps(x,ensure_ascii=False)+'\n' for x in matched[:180]));receipt.setdefault('filtered',[]).append({'path':path,'matched':len(matched),'returned':min(len(matched),180),'truncated':len(matched)>180,'filter':pattern.pattern})
              if cfg['mode']=='bank':output('bank-receipt.json',receipt)
              else:
                  assert 1<=len(names)<=160 and all(re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',n) for n in names)
                  def filetext(obj,n,rev,limit):
                      if not obj.get('content'):return {'error':obj.get('_error','empty'),'path':obj.get('path')}
                      b=base64.b64decode(obj['content']);t=b.decode('utf-8','replace');words=t.split();excerpt=' '.join(words[:limit])
                      return {'path':obj['path'],'sha256':hashlib.sha256(b).hexdigest(),'characters_read':len(t),'excerpt':excerpt,'excerpt_words':min(len(words),limit),'source_url':'https://github.com/'+n+'/blob/'+str(rev)+'/'+obj['path'],'edition_flags':[s for s in ('enterprise','commercial','non-production','production','self-host','docker','payroll','recruit','api') if s in t.lower()]}
                  def collect(pair):
                      number,name=pair;m=api('/repos/'+name);out={'audit_id':'R'+str(number).zfill(3),'requested_full_name':name,'observed_at':NOW,'bank_revision':head}
                      if '_error' in m:return out|{'retrieval_error':m['_error']}
                      n=m['full_name'];base='/repos/'+n;out.update({k:m.get(k) for k in ('full_name','html_url','description','stargazers_count','forks_count','default_branch','archived','disabled','pushed_at','open_issues_count','topics','license')})
                      cs=api(base+'/commits?per_page=1');rev=cs[0]['sha'] if isinstance(cs,list) and cs else None;out['revision']=rev;out['last_commit']=cs[0]['commit']['committer']['date'] if rev else None
                      out['sources']={'repository':API+base,'commit':cs[0]['html_url'] if rev else None};suffix='?ref='+rev if rev else ''
                      out['readme']=filetext(api(base+'/readme'+suffix),n,rev,150);out['license_file']=filetext(api(base+'/license'+suffix),n,rev,140)
                      out['bus_factor']='not measured';out['issue_response']='not measured; requires finalist audit';out['adoption_limitation']='A missing bank adoption row is unknown, not evidence of zero usage.'
                      aliases={name.lower(),n.lower()};out['bank_rows']={p:[r for a in aliases for r in idx.get(a,[])] for p,idx in bank.items() if p!='bank/bank_capability.jsonl'}
                      out['bank_membership_layers']=[p for p,rows in out['bank_rows'].items() if rows];out['bank_status']='ALREADY IN THE BANK' if out['bank_membership_layers'] else 'NEW';out['adoption_evidence']=out['bank_rows'].get('bank/bank_adoption_v2.jsonl',[])
                      return out
                  with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:rows=list(pool.map(collect,enumerate(names,1)))
                  for i,r in enumerate(rows,1):output('repo-'+str(i).zfill(3)+'.json',r)
                  for start in range(0,len(rows),5):
                      review=[]
                      for r in rows[start:start+5]:review.append({k:r.get(k) for k in ('audit_id','full_name','description','stargazers_count','archived','last_commit','revision','license','bank_status','bank_membership_layers','adoption_evidence','readme','license_file','retrieval_error')})
                      output('review-'+str(start//5+1).zfill(2)+'.jsonl',''.join(json.dumps(x,ensure_ascii=False)+'\n' for x in review))
                  receipt.update({'requested':len(names),'repositories_retrieved':sum(bool(r.get('full_name')) for r in rows),'readmes_retrieved':sum(bool(r.get('readme',{}).get('excerpt')) for r in rows),'license_files_retrieved':sum(bool(r.get('license_file',{}).get('excerpt')) for r in rows),'current_commit_retrieved':sum(bool(r.get('revision')) for r in rows),'already_in_bank':sum(r.get('bank_status')=='ALREADY IN THE BANK' for r in rows),'new':sum(r.get('bank_status')=='NEW' for r in rows),'membership_definition':'Match in any of six indexed repository-bearing exported bank layers; shelf presence means held, not admitted. Broader unpublished identity database not searched.'})
                  output('candidate-audit-receipt.json',receipt)
          for attempt in range(8):
              ref=api('/repos/'+REPO+'/git/ref/heads/main');parent=ref['object']['sha'];commit=api('/repos/'+REPO+'/git/commits/'+parent)
              elements=[{'path':p,'mode':'100644','type':'blob','content':t} for p,t in outputs.items()];tree=api('/repos/'+REPO+'/git/trees',{'base_tree':commit['tree']['sha'],'tree':elements},'POST')
              if '_error' in tree:raise RuntimeError('Evidence tree write failed: '+str(tree['_error']))
              c=api('/repos/'+REPO+'/git/commits',{'message':'research(recruiting_staffing): publish '+cfg['mode']+' evidence receipts','tree':tree['sha'],'parents':[parent]},'POST')
              if '_error' in c:raise RuntimeError('Evidence commit failed')
              result=api('/repos/'+REPO+'/git/refs/heads/main',{'sha':c['sha'],'force':False},'PATCH')
              if '_error' not in result:print('Published',len(outputs),'public evidence files; commit',c['sha']);break
              if result['_error'] not in (409,422):raise RuntimeError('Ref update failed: '+str(result['_error']))
              time.sleep(2)
          else:raise RuntimeError('Concurrent updates prevented safe publication')
          print('Completed; no upstream code executed, no application built or deployed.')
          PY
