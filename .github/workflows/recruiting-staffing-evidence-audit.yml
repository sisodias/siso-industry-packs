name: Recruiting staffing public evidence audit
on:
  push:
    branches: [main]
    paths: [packs/recruiting_staffing/evidence/audit-request.json]
permissions:
  contents: write
concurrency:
  group: recruiting-staffing-evidence-audit
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      REQUEST_REVISION: ${{ github.sha }}
    steps:
      - name: Run pinned SISO metadata collector with large-file retrieval correction
        shell: bash
        run: |
          python3 - <<'PY'
          import textwrap, urllib.request
          # This is our own public research collector, pinned before this compatibility fix.
          # No candidate application or third-party repository code is executed.
          revision='859dd0f0729b7c45f46c04b68261d8b0a36a4be4'
          url='https://raw.githubusercontent.com/sisodias/siso-industry-packs/'+revision+'/.github/workflows/recruiting-staffing-evidence-audit.yml'
          with urllib.request.urlopen(url,timeout=60) as stream:source=stream.read().decode()
          program=textwrap.dedent(source.split("python3 - <<'PY'\n",1)[1].rsplit('          PY\n',1)[0])
          old="o=api('/repos/'+REPO+'/contents/'+path+'?ref='+ref)\n    return json.loads(base64.b64decode(o['content']))"
          new="url='https://raw.githubusercontent.com/'+REPO+'/'+ref+'/'+path\n    with urllib.request.urlopen(url,timeout=90) as stream:return json.load(stream)"
          assert program.count(old)==1
          program=program.replace(old,new)
          exec(compile(program,'pinned-public-research-collector.py','exec'))
          PY
