name: Recruiting staffing public evidence audit
on:
  push:
    branches: [main]
    paths: [packs/recruiting_staffing/evidence/audit-request.json]
permissions:
  contents: write
concurrency:
  group: recruiting-staffing-evidence-audit
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      REQUEST_REVISION: ${{ github.sha }}
    steps:
      - name: Run pinned SISO public research collector
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request
          revision='02a98b3aac0c1b5379f797bd422c716c02b03cf0'
          url='https://raw.githubusercontent.com/sisodias/siso-industry-packs/'+revision+'/scripts/recruiting-staffing-research.py'
          with urllib.request.urlopen(url,timeout=90) as stream:source=stream.read().decode()
          exec(compile(source,'pinned-siso-recruiting-research.py','exec'))
          PY
